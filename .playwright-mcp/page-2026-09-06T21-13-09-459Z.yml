                        - paragraph [ref=f363e2030]: However, I had problems with a couple of the shirts. The light blue one came unstitched at the right shoulder seam, so I had to sew that up. For some reason, the navy shirt is not as long as the other colors and it leaves the bottom part of my belly exposed,.which is not the look I am going for.

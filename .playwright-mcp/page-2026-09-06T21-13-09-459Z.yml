                      - list [ref=f363e573]:
                        - listitem [ref=f363e574]: CONVENIENT 6-PACK VALUE - Stock up on everyday essentials with six cotton ribbed tank undershirts designed for dependable comfort, moisture-wicking performance, and easy everyday layering.
                        - listitem [ref=f363e575]: MOISTURE-WICKING COMFORT - Men's t-shirt made with Cool Comfort fabric helps wick moisture away from the body to keep you cool and comfortable, while advanced odor protection helps you feel fresh.
                        - listitem [ref=f363e576]: SOFT COTTON CLASSIC FIT - Men's tee made with soft cotton jersey moves with you in a regular fit that's not too tight or too loose, while heathered styles use a cotton-rich polyester blend.
                        - listitem [ref=f363e577]: POCKET CREWNECK DESIGN - A left chest pocket adds function and classic style, while the lay-flat crewneck collar helps create a clean look whether these men's pocket t-shirts are worn on their own or layered under shirts.
                        - listitem [ref=f363e578]: STAY-TUCKED TAG-FREE COMFORT - A longer t-shirt hem length is designed to stay tucked in, while the tag-free interior helps eliminate distractions from scratchy tags for smooth comfort throughout the day.

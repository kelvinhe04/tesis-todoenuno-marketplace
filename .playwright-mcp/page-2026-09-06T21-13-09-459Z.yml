        - generic [ref=f363e1108]:
          - heading "Product Description" [level=2] [ref=f363e1111]
          - paragraph [ref=f363e1113]: A men's cotton pocket t-shirt is a short-sleeve crewneck tee designed for soft everyday comfort, easy layering, and versatile wear. This Hanes men's t-shirt 6-pack features soft cotton jersey, while heather styles are made from a cotton/polyester blend, with Cool Comfort moisture-wicking fabric to help keep you cool and comfortable. Advanced odor protection helps you feel fresh throughout the day, while the regular fit offers easy comfort that is not too tight and not too loose. A left chest pocket adds function and classic style, and the lay-flat crewneck collar helps create a clean look. The longer hem length is designed to stay tucked in, and the tag-free interior helps eliminate distractions from scratchy tags. These assorted men's pocket tees work well on their own or layered under everyday clothing. Hanes recommends machine washing these t-shirts for men in cold water to keep them looking and feeling great.

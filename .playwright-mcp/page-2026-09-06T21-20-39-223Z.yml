              - listitem [ref=f406e620]: "Optimal Size: Mouse pad with wrist rest (9.84\" x 7.87\" x 0.98\"), Wrist rest for computer keyboard (17.32\" x 3.15\" x 0.98\"), making this pad set suitable for both man/women, all kind of occasion like working, meeting, gaming or other."
              - listitem [ref=f406e621]: "Excellent Quality: Ergonomic mouse pad smooth fabric will allow you ease moving your mouse meanwhile precise positioning, give your hand a cosy environment to operate your mouse. Edges has been reinforced to prevent deformation and damage to guarantee the longer hours of use. The soft memory foam-filled cushion part will slowly bounce back when your hand leave it, not easy to out of shape."
              - listitem [ref=f406e622]: "Non-skid Rubber base: Wrist rest for keyboard and mouse Provides heavy grip preventing sliding or unwanted movement for Keyboard and mouse pads, Double Sticking and Press handing for edge to supply flat and smooth edge and will not roll up nor split open."
              - listitem [ref=f406e623]: "Wide Application: This keyboard wrist pad is designed for people who need to work with the computer, laptop for a long time, for example, IT guys, gamer etc. This will be the partner that will make you relax; TECKNET 36 Months Warranty (Registered Only)"

        - generic [ref=f8e155]: punto único de entrada
      - text: "Figura — El frontend solo conoce el API Gateway, que valida el JWT y enruta cada solicitud REST al microservicio correspondiente. Cada microservicio es dueño exclusivo de su base de datos (persistencia poliglota: PostgreSQL para Usuarios/Auth, Órdenes y Pagos por consistencia ACID; MongoDB para Catálogo por flexibilidad de esquema; Redis para Carrito por velocidad). Órdenes, Pagos y Notificaciones no se llaman entre sí directamente: se coordinan publicando y consumiendo eventos en RabbitMQ, lo que permite agregar o quitar consumidores sin modificar quien emite el evento."

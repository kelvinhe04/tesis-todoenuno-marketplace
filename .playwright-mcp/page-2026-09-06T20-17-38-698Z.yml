      - generic [ref=f71e172]:
        - paragraph [ref=f71e175]
        - generic [ref=f71e177]:
          - heading "our story" [level=2] [ref=f71e178]
          - paragraph [ref=f71e179]: In 2000, Carly Dougherty was busy using her free time outside of university to offer students private tutoring. She found herself almost always fully booked, with demand far greater than she could ever cope with on her own. Her passion for tutoring and helping children grew further after she obtained her Master’s Degree in Child Psychology. The increasing demand for effective tutoring services and Carly’s passion led her to found Prep Academy Tutors with the mission to help children improve their school experience and achieve their academic goals.
          - paragraph [ref=f71e180]: After noticing the proven effectiveness of her approach, Carly and her husband Adrian assembled a dream team of like-minded individuals and opened Prep Academy Tutors across North America.
      - generic [ref=f71e183]:
        - generic [ref=f71e185]:
          - heading "The power of" [level=2] [ref=f71e186]
          - heading "a great tutor" [level=2] [ref=f71e188]
          - paragraph
          - paragraph [ref=f71e190]: We believe wholeheartedly that a great instructor can make all the difference in a child’s education. Our elite team of certified teachers recognize that every student learns differently, so you can trust that your child is getting the individual instruction they need.
          - paragraph [ref=f71e191]: We recognize the power of tutors working alongside students; helping them learn in a way that lecturers may not be able to. Our method is not stuffy or unapproachable. We are not the teacher at the front of the classroom—we are the smart friend who can explain things in a way that is easy to understand. Learning can be fun if it’s done the right way!
          - paragraph [ref=f71e192]: We provide private tutoring services for elementary school, high school and university prep in math, science, English, French, and every subject in between. Our goal is to make sure your child has the tools and confidence to score straight A’s—while enjoying the process!
        - paragraph [ref=f71e195]:
          - img "About-Us-Section-2-1" [ref=f71e196]
      - generic [ref=f71e199]:
        - paragraph [ref=f71e202]
        - generic [ref=f71e204]:
          - heading "every child" [level=2] [ref=f71e205]
          - heading "learns differently" [level=2] [ref=f71e206]
          - paragraph [ref=f71e207]: We recognize that no two students will learn exactly the same way. In fact, teachers are also naturally different in the way that they teach. For every student’s learning style, there is an ideal teacher. We ensure that our team of teachers are trained in a variety of different instructional techniques for this very reason, combining new-school learning with old-school values.
          - paragraph [ref=f71e208]: For example, we have tutors who teach using the Wilson Reading System and others who teach the Direct Instruction Reading Mastery program. For math, we have tutors who are trained in the Singapore Math philosophy and others who employ JUMP Math.
          - paragraph [ref=f71e209]: The idea behind our variety is some students may excel at one learning style and not another. By providing multiple options for students, we can ensure that we pair them with the best tutor for their needs. Prep Academy Tutors acts as a “matchmaker” between students, tutors, and programs, ensuring that our students are learning in the most effective way possible.

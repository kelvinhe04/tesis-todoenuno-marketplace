      - generic [ref=f71e122]:
        - generic [ref=f71e125]:
          - heading "gold standard" [level=2] [ref=f71e126]
          - heading "private tutoring service" [level=2] [ref=f71e127]
        - generic [ref=f71e128]:
          - generic [ref=f71e130]:
            - img "card icon ruler" [ref=f71e131]
            - heading "Confidence builders" [level=3] [ref=f71e132]
            - paragraph [ref=f71e133]: We provide in-home tutoring from certified teachers who prioritize building a student’s confidence through tailored personal attention. Whether your child is struggling or already has excellent grades, our end goal is improved confidence in and out of the classroom. Using proven teaching techniques and methodologies that are best suited to the individual student is the first step in helping your child achieve their goals. Then through open communication with our parents and students, we ensure ongoing progress. The final step is increased confidence through better comprehension, improved grades, and, ultimately, academic success.
            - generic [ref=f71e134]: Read More
          - generic [ref=f71e136]:
            - img "card icon teacher@2x" [ref=f71e137]
            - heading "Certified teachers & Educational Experts" [level=3] [ref=f71e138]
            - paragraph [ref=f71e139]: We believe in the power of education. You can always be confident that your child is being instructed by the most qualified individuals, as we only hire professionally certified teachers and exceptional human beings. Each of our tutors have the experience and qualifications to make sure your child succeeds; identifying roadblocks, working to achieve better results and introducing new approaches to learning. Rest assured that your tutor is not only knowledgeable with the subject material, but also knows how to effectively teach it – an important distinction that could make all the difference for your child.
            - generic [ref=f71e140]: Read More
          - generic [ref=f71e142]:
            - img "card icon house" [ref=f71e143]
            - heading "Flexible, in-home & online tutoring" [level=3] [ref=f71e144]
            - paragraph [ref=f71e145]: Our tutors work 7 days a week and around your family's schedule. Between extracurriculars, life, work and play, we guarantee that we will find a time for tutoring that is convenient for you and your child. Many of our tutors are extremely versatile and are able to teach across a variety of grades and ages. This can be helpful in scheduling for your family, as the same private tutor who you know and love could work with multiple siblings in the same home.
            - generic [ref=f71e146]: Read More
          - generic [ref=f71e148]:
            - img "card icon star" [ref=f71e149]
            - heading "Personal attention" [level=3] [ref=f71e150]
            - paragraph [ref=f71e151]: We are not the teacher at the front of the classroom—we are the smart friend who can explain things in a way that is easy to understand. We offer the highest level of service and professionalism while aiming to form a personal bond with your child. Part of our teaching philosophy is recognizing every student is different and has a different style of learning. We work with each individual family to create a personalized approach that fits their tutoring needs. This includes everything from the tutors we put forward, to teaching methodologies, to programs used, to homework and follow-ups.
            - generic [ref=f71e152]: Read More
      - generic [ref=f71e154]:

                        - generic [ref=f3e2524]:
                          - paragraph [ref=f3e2525]: Only after a couple play sessions in BF6 with this mouse, I can already feel how much more precise I can be with it. My first play session was a bit rough getting used to the feel of it. It’s quickly getting more natural. I switched from a ghost keyboards m1 mouse to this.
                          - paragraph
                          - paragraph [ref=f3e2526]: The left and right mouse clicks feel a bit more stiff than my m1 mouse which I like. Easier to avoid accidental inputs. All the other buttons feel solid with clean clicks.
                          - paragraph
                          - paragraph [ref=f3e2527]: The mouse wheel is a very different feel with more significant bumps while scrolling, but it adds a more tactile feel being easier to control. It also has a release that lets it just spin for probably more work type use rather than gaming.
                          - paragraph
                          - paragraph [ref=f3e2528]: It’s easy to setup, basically plug and play but a bit confusing. It comes with of course, a charging cable but the Bluetooth usb comes in some sort of housing that plugs in by the charging cable. Not sure if that is better or worse than how I have it now which is the usb receiver plugged into the back of my pc. Works fine.
                          - paragraph
                          - paragraph [ref=f3e2529]: Looking at the Logitech website shows up to 48 hours of battery life with default lighting, or up to 60 hours with no lighting. Fully charged it showed 26 hours (25 hours now at 96%). And turning off the lighting at 96% only goes up to 28 hours. Which is plenty as I usually plug my wireless device in to charge after use.
                          - paragraph
                          - paragraph [ref=f3e2530]: My favorite part of this mouse is how comfortable it is. It’s a bit thicker filling in my smaller hands more compared to my m1 mouse. Another nice added comfort feature is the thumb ledge. It keeps my thumb off my mouse pad, and helps with control of the mouse in high stress fps situations. The weight also help in precise aiming. My m1 mouse was 65g , the g502 is 111g plus the 1 big weight and 2 smaller weights I added making it go up to maybe 119g.
                          - paragraph
                          - paragraph [ref=f3e2531]: Highly recommend this mouse, and will try to update if it fails prematurely.

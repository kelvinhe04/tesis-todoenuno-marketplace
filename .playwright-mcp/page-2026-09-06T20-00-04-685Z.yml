                        - paragraph
                        - paragraph [ref=f3e2585]: What can be said about this mouse that hasn't been said before? This is the perfect mouse, there is no contest. I know it is a bit on the pricier side, but if you need a mouse, just get the cheapest one you can get and start saving to get this one, IT'S THAT GOOD.
                        - paragraph
                        - paragraph [ref=f3e2586]: The mouse glides over any decent mouse pad, you don't need to get a Logitech one. The shape is perfect for all kinds of grips and the weight system is great for customization.
                        - paragraph
                        - paragraph [ref=f3e2587]: The led has different brightness levels, including turning it off completely to save more battery, and the keys are just silent and satisfying to press.
                        - paragraph
                        - paragraph [ref=f3e2588]: Again, this is the best mouse ever, no other mouse will offer a better value for your money than this one. A bit steep, yes, but worth it.

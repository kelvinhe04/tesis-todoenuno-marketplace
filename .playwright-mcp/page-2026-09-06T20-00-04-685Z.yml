                        - generic [ref=f3e2209]:
                          - paragraph [ref=f3e2210]: I’ve been using the Logitech G502 Lightspeed for a while now, and it’s one of those mice that really earns its reputation—especially if you like having control and customization at your fingertips.
                          - paragraph
                          - paragraph [ref=f3e2211]: The first thing that stands out is the performance. The HERO 25K sensor is extremely precise, and tracking feels smooth and accurate whether you’re gaming casually or playing something more competitive. Combined with Logitech’s LIGHTSPEED wireless tech, it honestly feels just as responsive as a wired mouse.
                          - paragraph
                          - paragraph [ref=f3e2212]: The button layout is a huge advantage. With 11 programmable buttons, you can map shortcuts, macros, or in-game actions exactly how you want. It’s especially useful for games like FPS, MMOs, or even productivity tasks where extra controls make a difference.
                          - paragraph
                          - paragraph [ref=f3e2213]: Another feature I really like is the adjustable weight system. You can customize how heavy or light the mouse feels, which makes it easier to dial in something comfortable for your playstyle. It’s a small detail, but it actually makes a noticeable difference over time.
                          - paragraph
                          - paragraph [ref=f3e2214]: Battery life has been solid too. I don’t feel like I’m constantly charging it, and it can last up to around 60 hours depending on usage. Plus, it’s compatible with Logitech’s PowerPlay charging system if you want a wireless charging setup.
                          - paragraph
                          - paragraph [ref=f3e2215]: Comfort-wise, it’s clearly designed for right-handed users with a more ergonomic shape. It fits nicely in the hand, though it’s on the heavier side compared to ultra-light gaming mice, which may not appeal to everyone.
                          - paragraph
                          - paragraph [ref=f3e2216]: If I had a downside, it’s exactly that—the weight and size. If you prefer lightweight mice for fast flick movements, this might feel a bit bulky. Also, there’s a bit of a learning curve with all the buttons at first.
                          - paragraph
                          - paragraph [ref=f3e2217]: Overall, the G502 Lightspeed is a powerful, customizable gaming mouse that’s great for players who want precision and lots of control options. It’s not the lightest or simplest mouse out there, but if you value features and performance, it’s hard to beat.

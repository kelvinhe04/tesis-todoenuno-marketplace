                        - generic [ref=f3e2268]:
                          - paragraph [ref=f3e2269]: I am at over 2 Million clicks on Old School Runescape ALONE with this mouse on the powerplay mat and it's been perfect. Bought it in January 2023, so it's 3+ years of working just as brand new for me. All of my previous mice (Razer Deathadder x2) started double-clicking after 6 months or so.
                          - paragraph
                          - paragraph [ref=f3e2270]: I highly recommend this mouse to any gamers out there looking for a mouse. This will cost you more up front, but the price is absolutely right and it will save you WAY more in terms of having to replace prematurely.
                          - paragraph
                          - paragraph [ref=f3e2271]: In terms of MMO usage, it's got side buttons which I use in OSRS to hit Space to skip dialogue while questing, and to hit Esc to exit interfaces. There's not much more than that in OSRS due to heavy F-Key usage for high-level gameplay.
                          - paragraph
                          - paragraph [ref=f3e2272]: But for a right-hand user.. I mean, it's built for right-hand. For my large-ish hand, (I am 6 ft or 183cm tall) the size is perfectly comfortable. There is a wide DPI to choose from, but I keep mine low (? 3500 dpi) as I don't play any games competitively.
                          - paragraph
                          - paragraph [ref=f3e2273]: Again the powerplay mat compatibility is a HUGE plus as it charges wirelessly somehow and I have never had to plug in or swap any batteries in the entire 3 years+ that I've had the mouse.
                          - paragraph
                          - paragraph [ref=f3e2274]: Can't recommend it enough. Back to grinding Vorkath on my ironman on OSRS. later

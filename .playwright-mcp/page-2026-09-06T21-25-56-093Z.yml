                      - paragraph [ref=f431e2516]: Got these on sale for around $38 and was immediately impressed with the sound quality. I's been using off-brand wireless earbuds for years and they would often sound tinny or static-y while also being rather uncomfortable after about 30 minutes of use. Decided to go back to the classic over-ear headphones and trusted the Sony name and reviews. So far, I've been wearing them for over an hour while I walk and cook with no pain and minimal readjusting. Connected immediately and was charged up right out of the box. Haven't had them long but first impressions have been great!!

                      - paragraph [ref=f431e2619]: Sony is a quality product, but I admit, I was leery with the quality and this price. But, good news is they are great little headphones for the cost. I did think I ordred the noise cancelling ones so I was disappointed in that, but that's on me, not the product or seller. With them not being actual noise cancelling, they still block a lot of background noise pretty well. I will know more about how well they block out noise and how the battery life survives in a few weeks when we fly to Cali on vacation and I take these for the flight. The color is a soft blush color, they fit well and extend via the headband for larger heads, and are portable. I do recommend buying a carrying case for them - I picked up one with the fitted interior so they are held in place to avoid damage if in a bag and get kicked or dropped. Overall, I am happy with my purchase.

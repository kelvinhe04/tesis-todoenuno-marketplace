                      - paragraph [ref=f431e2472]: My wife and I both got matching pairs (mine is tan hers is pink), and so far we are loving it. Great sound quality and I can talk on the phone with them as well (which I’m not used to). It’s also her first personal pair of headphones she’s ever had which she was (and still is) excited for. The battery life is great and it’s compact for easy storage. My only reason for not giving them 5 is that the headphones aren’t too comfortable in that they make your ears sore after long periods of having them on (due to not going over your ears but instead on them). Also because of the compact build it’s a bit difficult to rest them around your neck (but very comfortable to just have them on the head behind the ears). I’d say it’s still well worth the price and a great buy despite that (also love the colors).

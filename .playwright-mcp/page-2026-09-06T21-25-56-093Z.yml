                      - generic [ref=f431e2831]:
                        - paragraph [ref=f431e2838]: Muy cómodos, en mi trabajo participo en muchas reuniones virtuales y hay días en que los traigo puestos tal vez 5 o 6 horas seguidas sin quitármelos y no me molestan, a veces hasta se me olvida que los traigo. Excelente conectividad bluetooth con el celular y laptop, se pueden conectar ambos a la vez. En el gimnasio los he usado corriendo y haciendo todo tipo de ejercicios y son cómodos, ligeros y no se mueven. Los he sudado y la cubierta de las almohadillas no se ha dañado nada. El audio es buenísimo, muy bien nivelado y aunque no tienen cancelación de ruido, con un volumen moderado y por las mismas almohadillas, aisla lo suficientemente bien como para que los ruidos o música del gimnasio, por ejemplo, queden muy en el fondo. Nunca ha sido necesario subir al máximo el volumen. Además con la app puedes ecualizar a tu gusto, también recomiendo, si usas Spotify, ecualizar ahí para tener la mejor experiencia posible. La batería dura muchísimo, en 3 meses de uso usándolos en promedio 3 o 4 horas diarias y solo los he puesto a cargar 3 veces. Cargan muy rápido también. El único detalle que les he encontrado es que con mi SmartTV Hisense, jugando Playstation tiene un delay de medio segundo o 1 segundo, y con Youtube cada 40 segundos o 1 minuto "se brinca" o "se come" como 1 segundo tanto del audio como del video. Pero para mi no ha sido problema porque realmente solo los uso para escuchar música desde mi celular y para tener llamadas de trabajo. En resumen, son cómodos, lucen bien, sobrios y de buena calidad, muy buen audio y excelente rendimiento de batería.

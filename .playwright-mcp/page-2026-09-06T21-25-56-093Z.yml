                        - generic [ref=f431e2560]:
                          - paragraph [ref=f431e2561]: The product arrived well packaged. There was a delivery delay but it was not horrendous and to be expected given that it was ordered during Parime Days,
                          - paragraph
                          - paragraph [ref=f431e2562]: The headphones arrived almost fully charged, Set up was relatively easy, but you really do need to use their app to complete the set up process. The app also allows you to change some settings and select equalizer settings that work for you.
                          - paragraph
                          - paragraph [ref=f431e2563]: The switches have a nice feel to them. They do have raised areas designed to help you find the correct switch by feel. There are times however when I find that it is easier to adjust the volume using the phone or I remove the headphone to make a change. This is a very subjective items so you may not have the same issue. No stars were deducted for that reason.
                          - paragraph
                          - paragraph [ref=f431e2564]: These are an on ear device. It was not uncomfortable to me, but it did take some getting used to and here again...Personal preference comes into play. On a warm and humid day you may experience some sweating where the ear cup rides on your ear. That may allow for some movement / shifting of the headphone depending on what you are doing. They may thus not work out well for use doing exercising as an example.
                          - paragraph
                          - paragraph [ref=f431e2565]: The sound quality is great at this price point. I have Bose ear buds. The sound from this device is not Bose quality and you should not expect it to be Bose quality. It is good to very good however. The equalizer settings allow you to control all five typical equalizer settings PLUS a separate adjustment for th4 bass.
                          - paragraph
                          - paragraph [ref=f431e2566]: Paring was easy and fast. The connection remains stable most of the time. There is a selection that allows you to select either top quality sound or a more stable connection. I chose sound quality an the vast majority of the time the connection was stable with no noise present. There may be times however, that due to local conditions / interference you may have a little popping or very brief drop out. I have worn these headphones a LOT since they arrived and while I have experienced that, it was very limited. Now I also have a lot of electric / electronic devices in use on my property and that will may explain what I experienced. I did have some interference from some household devices when I wass very close to them.
                          - paragraph
                          - paragraph [ref=f431e2567]: The battery life seems to be very good. I have worn m for several hours and the voice system still indicates 100% at startup. Unlike my Bose products the battery monitoring system is not linear where it will call out 100%, 90%, 80%b etc... It may call out 100% until the battery hits 50% (As an example) and then te voice system will drop from stating 100% to 50%. I do not see that as an issue or negative given the very long stated by the manufacturer battery life, and I have no disagreement with their claims about battery life aty this point in time,
                          - paragraph
                          - paragraph [ref=f431e2568]: So again...Thus far I am very pleased with the fit, quality, and sound quality of these headphones. Do bed aware that tey are NOT noise cancelling. There will be some outside noise reduction dur to the ear cups of course.

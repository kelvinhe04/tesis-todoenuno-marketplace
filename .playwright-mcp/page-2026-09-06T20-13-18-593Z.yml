              - generic [ref=f40e55]:
                - heading "ABOUT US" [level=2] [ref=f40e56]
                - paragraph [ref=f40e57]: Emerick & Company, P.C. is committed to providing a high level of client service and quality. Our firm’s mission is to serve our clients and help others with exceptional professional service. With the diverse qualifications and experience of our staff, we are able to provide quality accounting services for reasonable fees.
                - paragraph
                - paragraph [ref=f40e58]: In 1990, David Emerick established Emerick & Company, P.C. after working several years for national and regional accounting firms. The company began as a sole proprietorship and has grown to a firm with offices in Kansas City, Missouri and Clearwater, Florida.
                - paragraph
                - paragraph [ref=f40e59]: Our Kansas City office employs professionals with financial accounting and reporting or tax expertise, as indicated by certified public accountant and enrolled agent designations.
                - paragraph
                - paragraph [ref=f40e60]: We place a premium on client relationships, building a high level of trust and maintaining a commitment to our client’s success. We seek to be a valued resource for advice, ideas and solutions and if we partner with you, we will use our resources for your success.

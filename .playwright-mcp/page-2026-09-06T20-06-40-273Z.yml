          - paragraph [ref=f31e918]: "Set Includes the following brushes: (1) RT 217 that precisely apply liquid or cream foundation and contour makeup. (1) RT 421 that blend cream highlighter or blush. (1) RT 420 that softly glide powder contour makeup or highlighter. (1) RT 317 to apply and smudge liquid or cream eyeliner. (1) RT 425 to apply, blend cream lipsticks and liners. Clean weekly with our Real Techniques Brush Cleansing Gel and Spray for improved brush performance."

                      - generic [ref=f158e2578]:
                        - paragraph [ref=f158e2579]: This mouse has been one of the better ones I've had. It fits my larger hands well, which is a primary selling point for myself when looking for mice. It also uses only 2 AAA batteries. Most of the other mice I've had use 1 or 2 AA batteries. So, it results in a lighter weight during use.
                        - paragraph
                        - paragraph [ref=f158e2580]: "I said there was one drawback and it's this: the Back button sometimes fails to respond to clicks. It could be my particular unit is the problem. It may also be as a new mouse I'm not used to yet, my muscle memory is not pressing the button correctly every time. The result is about 1 in every 20 Back button presses haven't been honored."
                        - paragraph
                        - paragraph [ref=f158e2581]: Another thing I've noticed from time to time is the mouse cursor seems to have "timed out" if it's sitting idle for a length of time. The cursor won't move when the mouse is moved after a period of idling until one of the mouse buttons is pressed.
                        - paragraph
                        - paragraph [ref=f158e2582]: Bottom line is this mouse isn't perfect, but I've seen far worse mice before. And I've seen better mice.

              - table [ref=f158e1100]:
                - rowgroup [ref=f158e1101]:
                  - row [ref=f158e1102]:
                    - cell "Q1" [ref=f158e1103]
                    - cell "Why is my wireless mouse not working?" [ref=f158e1104]
                  - row [ref=f158e1105]:
                    - cell "-" [ref=f158e1106]
                    - cell "1. Please check if the battery is installed with the correct polarity. Make sure the power switch is set to \"ON\". 2. Try to plug the receiver into a different USB-A port or Restart the computer. 3. The battery might be dead." [ref=f158e1107]
                  - row [ref=f158e1108]:
                    - cell "Q2" [ref=f158e1109]
                    - cell "Where is the USB A receiver?" [ref=f158e1110]
                  - row [ref=f158e1111]:
                    - cell "-" [ref=f158e1112]
                    - cell "Please open the battery cover; the receiver is stored underneath the battery compartment." [ref=f158e1113]
                  - row [ref=f158e1114]:
                    - cell "Q3" [ref=f158e1115]
                    - cell "How to wake up the mouse?" [ref=f158e1116]
                  - row [ref=f158e1117]:
                    - cell "-" [ref=f158e1118]
                    - cell "Powers down after 10 minutes of idle and requires 2-3 clicks to wake it." [ref=f158e1119]
                  - row [ref=f158e1120]:
                    - cell "Q4" [ref=f158e1121]
                    - cell "Why is my wireless mouse not working for a while?" [ref=f158e1122]
                  - row [ref=f158e1123]:
                    - cell "-" [ref=f158e1124]
                    - cell "Low battery power. Please replace the battery." [ref=f158e1125]
              - table [ref=f158e1127]:
                - rowgroup [ref=f158e1128]:
                  - row [ref=f158e1129]:
                    - cell "Q5" [ref=f158e1130]
                    - cell "When the mouse responds slowly, has delays, or lacks precision, please follow these steps to re-pair it" [ref=f158e1131]
                  - row [ref=f158e1132]:
                    - cell "-" [ref=f158e1133]
                    - cell "1. Insert the batteries into the mouse, switch it to the \"NO\" position to power it on." [ref=f158e1134]
                  - row [ref=f158e1135]:
                    - cell "-" [ref=f158e1136]
                    - cell "2. Plug in the mouse receiver to computer, then press and hold both the left and right mouse buttons simultaneously." [ref=f158e1137]
                  - row [ref=f158e1138]:
                    - cell "-" [ref=f158e1139]
                    - cell "3. Place the mouse within 20 cm of the receiver and wait for 3–5 seconds until pairing is complete. Your mouse will then be successfully paired with the receiver and ready for normal use." [ref=f158e1140]
                  - row [ref=f158e1141]:
                    - cell "Q5" [ref=f158e1142]
                    - cell "How can I confirm the DPI of the mouse?" [ref=f158e1143]
                  - row [ref=f158e1144]:
                    - cell "-" [ref=f158e1145]
                    - cell "The DPI indicator light will light up when the DPI is switched. The red light of the first gear DPI (800) will turn off after it turns red since the red light of the second gear DPI (1200) will turn off afterit turns red twice, and the red light of the third gear DPI (1600) will turn off after it turns red three times. Easily switch between 800-1200-1600." [ref=f158e1146]
                  - row [ref=f158e1147]:
                    - cell "Q6" [ref=f158e1148]
                    - cell "What are the dimensions and weight of this mouse?" [ref=f158e1149]
                  - row [ref=f158e1150]:
                    - cell "-" [ref=f158e1151]
                    - cell "This mouse is L 5.1 inches, W 3.2 inches, H 1.6 inches, and a weight of 3oz." [ref=f158e1152]

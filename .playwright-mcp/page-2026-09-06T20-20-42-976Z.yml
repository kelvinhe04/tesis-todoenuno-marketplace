    - generic [ref=f116e45]:
      - heading "Reading Tutoring" [level=1] [ref=f116e46]
      - paragraph [ref=f116e48]: Reading struggles have a wide impact. But with our intensive, personalized reading tutoring, we can help students improve their literacy and comprehension skills, as well as develop a true love of reading.
    - generic [ref=f116e52]:
      - generic [ref=f116e55]:
        - img "tutor and students at Sylvan Learning Center with tokens and ipad" [ref=f116e57]
        - generic [ref=f116e59]:
          - generic [ref=f116e60]:
            - heading "This is the help with reading your child needs" [level=2] [ref=f116e61]
            - paragraph [ref=f116e62]: We improve reading skills by meeting students where they’re at. We’ll assess your child’s unique reading abilities, and then identify how we can best help them improve fluency, comprehension and reading competence. We offer support for all levels of reading skills to help your child succeed.
            - paragraph [ref=f116e63]: Our approach works. In fact, Sylvan reading students typically see up to three times more growth in scores than non-Sylvan students!
            - paragraph [ref=f116e64]: Plus, our curriculum is aligned with school standards and our reading teachers are experts at encouraging and motivating students. The great thing about our teachers and our interactive technology is that they adapt to your child’s unique needs. We won’t stop until your child masters each concept!
            - paragraph
          - link "Find reading tutors near me" [ref=f116e66] [cursor=pointer]:
            - /url: "#contact-form"

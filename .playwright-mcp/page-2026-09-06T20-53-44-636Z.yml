          - generic [ref=f189e530]:
            - heading "Cleaning services that meet your needs" [level=2] [ref=f189e535]
            - generic [ref=f189e537]:
              - img "Team member cleaning kitchen island" [ref=f189e541]
              - generic [ref=f189e542]:
                - heading [level=3] [ref=f189e543]:
                  - link "Recurring cleaning" [ref=f189e544] [cursor=pointer]:
                    - /url: /cleaning-services/home
                - generic [ref=f189e545]: We recommend our popular weekly or bi-weekly cleaning, perfect for maintaining a tidy home. Our routine cleaning includes dusting, vacuuming, bathroom cleaning, and kitchen cleaning. Our recurring services are ideal for busy people who don’t have time to clean but appreciate the serenity and peace of mind of a clean house.
            - generic [ref=f189e547]:
              - img "Merry Maids cleaning bottles" [ref=f189e551]
              - generic [ref=f189e552]:
                - heading [level=3] [ref=f189e553]:
                  - link "Detailed cleaning" [ref=f189e554] [cursor=pointer]:
                    - /url: /cleaning-services/deep-clean
                - generic [ref=f189e555]: We'll reach those often-neglected areas like baseboards, inside appliances and ceiling fans. Our detailed cleaning services are perfect for move-ins/move-outs, seasonal tasks such as spring cleaning, and prior to special occasions such as an open house, holiday party or birthday gathering. Contact Merry Maids today and leave the details to us!
            - generic [ref=f189e557]:
              - img "Merry Maids team member cleaning oven" [ref=f189e561]
              - generic [ref=f189e562]:
                - heading [level=3] [ref=f189e563]:
                  - link "Specialty cleaning" [ref=f189e564] [cursor=pointer]:
                    - /url: /cleaning-services/specialty
                - generic [ref=f189e565]: Need your grimy appliances deep-cleaned? Want your walls washed before painting or a special occasion? Our specialized cleaning services have you covered. If your house has unique cleaning needs, this is your solution. We tailor our cleaning services to fit your specific needs, leaving your space ready for any event.
    - complementary [ref=f189e566]:
      - generic [ref=f189e567]:
        - generic [ref=f189e572]:
          - generic [ref=f189e575]:
            - heading [level=2] [ref=f189e577]:
              - text: Here to
              - emphasis [ref=f189e578]: help
            - generic [ref=f189e579]:
              - generic [ref=f189e581]:
                - button "Can I ask for special requests or request focus on certain areas? +" [ref=f189e582] [cursor=pointer]
                - paragraph [ref=f189e584]: "Yes! We are happy to accommodate any special requests you may have. If parts of your home are especially cluttered or untidy, our team can spend their time just on those areas so that you get the best value for your money. Common special requests we receive include: de-griming baseboards, cleaning inside cabinets, removing pet hair from furniture, and de-cluttering closets."
              - generic [ref=f189e586]:
                - button "How often should I schedule a deep cleaning service? +" [ref=f189e587] [cursor=pointer]
                - paragraph [ref=f189e589]: For most homeowners, a one-time deep cleaning every 6 to 12 months is usually sufficient. If you aren't receiving regular cleaning on a weekly or bi-monthly basis, you may want to schedule cleanings more frequently.
              - generic [ref=f189e591]:
                - button "Are your cleaners insured and bonded? +" [ref=f189e592] [cursor=pointer]
                - paragraph [ref=f189e595]: Yes, all Merry Maids® cleaners are insured and bonded so you can feel secure in your home cleaning choice.
              - generic [ref=f189e597]:
                - button "Are your cleaning products safe for pets and children? +" [ref=f189e598] [cursor=pointer]
                - paragraph [ref=f189e601]: We know you strive to protect your kids’ and pets health and safety, and so do we! Merry Maids® uses environmentally friendly and pet-safe cleaning products.
              - generic [ref=f189e603]:
                - button "What is the difference between Merry Maids and other cleaning companies? +" [ref=f189e604] [cursor=pointer]
                - paragraph [ref=f189e607]: Merry Maids® does more than just take care of homes—we take care of people. We give you back the time you deserve so that you can focus on what matters most. We have 40 years of experience in professional home cleaning, which has allowed us to develop advanced, thorough processes that deliver unrivaled, worry-free results. That's our specialty.
            - link "All FAQs" [ref=f189e609] [cursor=pointer]:
              - /url: /frequently-asked-questions

    - main [ref=f41e39]:
      - heading "We help entrepreneurs master their financial lives." [level=1] [ref=f41e47]
      - generic [ref=f41e53]:
        - 'heading "Understanding your finances should be three things: simple, effortless, and affordable." [level=2] [ref=f41e55]'
        - paragraph [ref=f41e57]:
          - text: Bench is an online bookkeeping and tax service for small business owners in the United States. Founded in 2013 and now a Mainstreet company, Bench pairs intuitive software with a dedicated team of in-house bookkeepers — so business owners get accurate, up-to-date financials without doing the work themselves. It's bookkeeping done
          - emphasis [ref=f41e58]: for
          - text: you, not
          - emphasis [ref=f41e59]: by
          - text: you.
      - generic [ref=f41e63]:
        - generic [ref=f41e64]:
          - generic [ref=f41e65]:
            - heading "What we do" [level=2] [ref=f41e67]:
              - text: What we do
              - strong
            - paragraph [ref=f41e68]: We run the complete financial back office for small businesses. That means monthly bookkeeping, accurate “tax-ready” year-end financial statements, catch-up bookkeeping for owners who've fallen behind, and income tax filing and advisory. Behind every account is a human, dedicated bookkeeper backed by software that automates the busywork — the combination is what lets us deliver accurate books every month without eating up your time.
          - heading "Bench today" [level=2] [ref=f41e70]
        - paragraph [ref=f41e71]: Bench was acquired by Mainstreet in December 2024 and relaunched in January 2025, with the platform, in-house bookkeeping team, and customers' historical financial data all kept intact. On top of Bench's bookkeeping and tax services, Mainstreet also offers tax credits — something most accountants won't touch — and Bench customers get access to it. It's a new chapter for Bench, built on the same model that made it a leader in the first place.

              - heading "THE MINIMALIST" [level=3] [ref=f300e1204]
              - paragraph [ref=f300e1205]: The clean lines and minimalism of mid-century modern design is the inspiration behind this slim timepiece–the Minimalist. Built on the principles of balance and proportion, this unassuming watch has a simple dial with luminescent hour markers and a variety of styles and 22mm bands and bracelets to complete any look. Each of our Fossil mens’ watches are built to last and embody the bold, creative spirit of their wearers–and the Minimalist is no different.

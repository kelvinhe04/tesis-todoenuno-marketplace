                      - generic [ref=f169e3073]: 5 out of 5 stars
                      - link [ref=f169e3076] [cursor=pointer]:
                        - /url: /portal/customer-reviews/srp/-/R3BI9NDBREK840/ref=cm_cr_dp_d_rvw_ttl?_encoding=UTF8&ie=UTF8
                        - heading "Why consider this one" [level=5] [ref=f169e3077]
                      - generic [ref=f169e3078]: Reviewed in the United States on November 10, 2018
                      - generic [ref=f169e3079]:
                        - 'link "Size: 5 Shelf Color: Brown" [ref=f169e3080] [cursor=pointer]':
                          - /url: /portal/customer-reviews/B01DJJ8HGM/ref=cm_cr_dp_d_rvw_fmt?_encoding=UTF8&formatType=current_format
                          - generic [ref=f169e3081]: "Size: 5 Shelf"
                          - text: "Color: Brown"
                        - link "Verified Purchase" [ref=f169e3084] [cursor=pointer]:
                          - /url: /gp/help/customer/display.html/ref=cm_cr_dp_d_rvw_avp?ie=UTF8&nodeId=G8UYX7LALQC8V9KA
                      - generic [ref=f169e3087]:
                        - generic [ref=f169e3093]:
                          - paragraph [ref=f169e3094]: I have been using a very similar product for many years in my closet for shoes. I tried a lot of different ways to store my shoes so they are out of the way net conveniently available when I need them and a hanging canvas compartmented organizer like this is by far the best way I’ve ever found.
                          - paragraph
                          - paragraph [ref=f169e3095]: The bedroom in my new house has a walk-in closet. Seriously I don't know how I existed without one before now. While that does give me more room, surprisingly it makes organization of my clothes more difficult, especially things like tee shirts which never do well in a dresser drawer but are impractical to hang.
                          - paragraph
                          - paragraph [ref=f169e3096]: QUALITY OF CONSTRUCTION
                          - paragraph
                          - paragraph [ref=f169e3097]: I have this hanging next to a shoe organizer that is a similar concept that I've had for many years. By comparison this newer organizer feels like it is made of slightly thinner canvas, but because of the way it's designed I don't think that makes it any weaker or less effective, it's strong enough that I doubt if it will ever wear out or tear. Unlike some similar brands this one has a heavy cardboard reinforced shelf at every opening, not just top and bottom. In fact the top doesn't even use cardboard, it has a wire perimeter frame to which are attached the hangers. My only gripe about this product is that they don't include any instructions, and while it doesn't need much they could have, and should have, instructed us that the wire frame has an up and a down.
                          - paragraph
                          - paragraph [ref=f169e3098]: There is no assembly with this organizer, just lift it out and let it fall into place, then hang it over the closet rod. Each cubicle has a cardboard bottom shelf that supports the weight of about a dozen shirts without sagging. Because the shirts are stacked out in the open it is easy to find and select the one I want to wear. The proper way to install it is with the two little bumps that attach to the hooks pointing up. That way the frame supports the entire top. If you install the frame upside down it will work but it won't support the top quite as well.
                          - paragraph
                          - paragraph [ref=f169e3099]: DETAILS TO KNOW
                          - paragraph
                          - paragraph [ref=f169e3100]: The two most common ways to hang these organizers in the closet are either hook and look tape straps or wire coat hanger hooks. I prefer the hooks because over time the hook and loop tape loosens and is not able to hold the organizer as securely.
                          - paragraph
                          - paragraph [ref=f169e3101]: One observation is that if you are attracted to the feature that there are side pockets, don't get too excited. They aren't very practical and if you put more than one of these organizers side by side, as I did when I saw how much I liked the first one, you can't get to the side pockets anyway.
                          - paragraph
                          - paragraph [ref=f169e3102]: I can easily see why this organizer is so well liked. Of course I can't compare it to every other brand made but there is nothing whatsoever to dislike about this one.

                        - link "Verified Purchase" [ref=f169e3038] [cursor=pointer]:
                          - /url: /gp/help/customer/display.html/ref=cm_cr_dp_d_rvw_avp?ie=UTF8&nodeId=G8UYX7LALQC8V9KA
                      - paragraph [ref=f169e3048]: We just moved into a 5th Wheel, which means pairing our lives down to just over the essentials...with very limited additives. Fortunately, the master bedroom does have a decent sized closet, but it ain't a walk-in closet or a large closet for an RV, much less what you'd find in an standard master bedroom in a 'regular' house. There are limited drawers and limited storage for other things, so maximizing your space is key! I had a 3 shelf, hanging closet organizer. The compartments were smaller, it was reasonably sturdy, but it just didn't get the job done. My wife found this one on Amazon for herself. The storage boxes/shelves are just taller and a bit wider than the one I had. It has 3 great mesh/web pockets on the outside on BOTH SIDES! Those are great for those miscellaneous items and are great to keep the nightstand clear of those little items that create a lot of clutter or rob you of room for things like a cup of water or the book you are reading... It's plenty sturdy, has the hard wire hooks that are strong, but also fit in the hanger holes on RVs (not just over a standard closet rod). So I bought one for myself. Best part is that it is the perfect length to give you max storage, while going all the way down to the bottom of the closet without touching the floor and bunching up. All my clothes that typically would go into a dresser can be stored in this and I'm left with just the right amount of hanging space for my pants and shirts, etc. If you want to save space and hide your stuff in a visible, yet organized way, then get one of these!!
                      - generic [ref=f169e3049]: 11 people found this helpful

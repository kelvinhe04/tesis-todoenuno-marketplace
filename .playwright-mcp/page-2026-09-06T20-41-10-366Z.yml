                      - paragraph [ref=f169e3160]: Exactly as described and just what I was looking for to help organize my aunt's closet. We're trying to coordinate the colors of her new storage items (staying in the creams, beiges & browns) because it makes for a neater and more organized appearance (IMO). So the color of this item and not just they function was a factor in our decision to purchase it. The pockets on the sides came in handy for several pairs of slippers that were taking up space on the floor of her closet and a couple of scarves that she had hanging...so we freed up some floor space AND some hanging space before she even utilized the shelves! The shelves have a good amount of space between them, but it wasn't our intention to "stuff" them. We put about 5 folded shirts on one shelf, 2 smaller purses on one shelf, 1 large purse on one shelf, and the bottom two shelves hold 1 pair of lightweight boots each (*gg-type, not big & heavy). There is definitely more space to put more things if you need to, but we didn't want the look of sagging and/or bulging shelves for this project. Despite the fact that we didn't over fill the shelves, it made a big difference in the appearance of my aunt's closet. Just eliminating the scarves and purses that were just wrapped around old white plastic hangers has drastically improved the look of the area. Together with some other storage items (like fabric bins and lidded boxes), her closet is really shaping up!

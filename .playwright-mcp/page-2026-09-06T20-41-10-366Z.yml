                      - generic [ref=f169e3032]: Reviewed in the United States on October 27, 2020
                      - generic [ref=f169e3033]:
                        - 'link "Size: 5 Shelf Color: Brown" [ref=f169e3034] [cursor=pointer]':
                          - /url: /portal/customer-reviews/B01DJJ8HGM/ref=cm_cr_dp_d_rvw_fmt?_encoding=UTF8&formatType=current_format
                          - generic [ref=f169e3035]: "Size: 5 Shelf"

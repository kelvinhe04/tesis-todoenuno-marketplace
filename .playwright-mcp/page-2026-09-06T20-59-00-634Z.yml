                        - generic [ref=f226e1820]:
                          - paragraph [ref=f226e1821]: So I finally got these open, washed and on the bed and have mostly good feedback.
                          - paragraph
                          - paragraph [ref=f226e1822]: They are soft like people are saying. They didn't feel like the jersey knits I've gotten from Target or Kohl's. They feel "smoother." I don't know what word I want to use, but they do feel good and cool as well so far.
                          - paragraph
                          - paragraph [ref=f226e1823]: I did also notice what I thought was a dropped seam on the pillowcase only to realize it was on both in the same way and thus, must be a design choice? The case is folded overview a few inches and sewn fully together on the one side but left loose and able to be folded/unfolded on the other. I don't like this. I feel like this will look uneven and will be constantly looking...untucked?
                          - paragraph
                          - paragraph [ref=f226e1824]: Color was as described and after I slept on these For was perfect for our mattress, and they go on nicely.
                          - paragraph
                          - paragraph [ref=f226e1825]: I may come revise this up or down on stars. Thinking 3 stars right now, but if they feel good after sleeping, I plan to come back and get another set.
                          - paragraph
                          - paragraph [ref=f226e1826]: "Update: Four stars. Get these sheets. Washed well, and I've slept on them a few days already. Going to watch for a deal so I can get another set. Only gripe is the \"dropped seam\" on the pillowcase."
                          - paragraph
                          - paragraph [ref=f226e1827]: "Final Update: A few weeks in, and don't laugh. I finally realized those \"drop seams\" have a purpose and are not an accident. I feel dumb, so I'm adding this for anyone else that might not know. They are to fold over and hide the pillow from view. Or at least that's my story, and I'm sticking to it!"
                          - paragraph
                          - paragraph [ref=f226e1828]: And now my son wants a set.

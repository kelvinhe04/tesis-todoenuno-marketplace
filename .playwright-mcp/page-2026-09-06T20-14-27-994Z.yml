                - img "Close and Open Icon A graphic of a plus and minus icon that represents the action to close and open." [ref=f48e307]
                - generic [ref=f48e309]: Does Bench do all my bookkeeping tasks for me?
              - paragraph [ref=f48e313]: Our bookkeeping software and team of experts handle most of the work, making bookkeeping simple for you. However, there are some things about your business only you can provide, like uploading certain documents and sharing context for categorizing transactions. Each month, we may check in with you to ensure your books are accurate and your deductions are maximized.
          - listitem [ref=f48e314]:
            - generic [ref=f48e315]:
              - generic [ref=f48e316] [cursor=pointer]:
                - img "Close and Open Icon A graphic of a plus and minus icon that represents the action to close and open." [ref=f48e318]
                - generic [ref=f48e320]: What happens if I take a long time to respond to my Bench team’s requests for information?
              - paragraph [ref=f48e324]: Timely responses help your bookkeeping team keep your books up to date and avoid delays. Staying on top of this ensures a stress-free tax season and gives you access to current financial insights, empowering you to make informed, impactful decisions for your business.
          - listitem [ref=f48e325]:
            - generic [ref=f48e326]:
              - generic [ref=f48e327] [cursor=pointer]:
                - img "Close and Open Icon A graphic of a plus and minus icon that represents the action to close and open." [ref=f48e329]
                - generic [ref=f48e331]: Is it mandatory to connect my business accounts to Bench?
              - paragraph [ref=f48e335]: Connecting your accounts to Bench automates repetitive tasks like data entry, saving you time and effort. It eliminates the need for manual uploads, with your data appearing in your account instantly. This ensures your bookkeeping team can work efficiently, keep your books up to date, and help you get the most out of the service.
          - listitem [ref=f48e336]:
            - generic [ref=f48e337]:
              - generic [ref=f48e338] [cursor=pointer]:
                - img "Close and Open Icon A graphic of a plus and minus icon that represents the action to close and open." [ref=f48e340]
                - generic [ref=f48e342]: Why does Bench still need me to upload documents even if my accounts are connected?
              - paragraph [ref=f48e346]: Occasionally, we may need additional documents, such as account statements or receipts, to ensure the information we have is accurate. Sharing files with your bookkeeping team is quick and easy—just upload the document, and we’ll handle the rest.

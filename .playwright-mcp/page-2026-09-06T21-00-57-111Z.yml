                        - generic [ref=f235e2169]:
                          - paragraph [ref=f235e2170]: CeraVe PM has become my go-to nighttime moisturizer. I’ve tried quite a few different lotions over the years, but I keep coming back to this one because it’s simple, lightweight, and does exactly what I want it to do before bed.
                          - paragraph
                          - paragraph [ref=f235e2171]: It goes on smoothly without feeling greasy or heavy, and I like that it absorbs pretty quickly. My skin feels moisturized when I wake up without that oily feeling that some thicker creams leave behind.
                          - paragraph
                          - paragraph [ref=f235e2172]: I actually use this as part of a combo with the CeraVe AM Facial Moisturizing Lotion during the day. The AM lotion has SPF, which makes it really convenient for daytime, and then I switch to the PM lotion at night. Having the two together makes it really easy to stick to a consistent skincare routine without overthinking it.
                          - paragraph
                          - paragraph [ref=f235e2173]: For me, the AM + PM combination has become my go-to basic skincare routine. Nothing complicated, just a good moisturizer for the day and one for nighttime. The 3 oz bottle also lasts me a good while since I don't need to use much each night.
                          - paragraph
                          - paragraph [ref=f235e2174]: If you’re looking for a straightforward nighttime moisturizer that you can easily work into your daily routine, I’d definitely recommend this one.

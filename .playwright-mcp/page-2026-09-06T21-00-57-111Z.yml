                      - paragraph [ref=f235e2025]: FYI, I am writing this long overdue review after using this moisturizing lotion for at least 6+ years now, so not a limited experience. I tried it after it was recommended by my dermatologist. In fact she hands out a list of her recommended products & this as well as the daytime CeraVe (it has sunblock in it) were on the list along with several expensive specialty options. I tried CeraVe PM & have never looked back after all this time! I really miss it on my skin if I'm ever w/out it. I love how light it feels yet moisturizing, not sticky, absorbs completely and quickly. It is light but very affective. I usually wear it as my daytime lotion as well as at night if I don't need the advantage of sunblock that is provided by their daytime moisturizing version. I really miss it on my skin whenever I’m without it. I love how lightweight and moisturizing it feels on my face—never sticky, it absorbs completely, and quickly. It’s lightweight but very effective. Also, it is reasonably priced. I like how it is available in drugstores , discount dept stores as well as online options- nice when I am on vacation & run short. For ref I am now 68 YO, had oily skin in younger years & now I'm a bit mixed but lean toward dry skin -especially living in our dry Co climate. It is the only lotion I use on my face & have been very happy ever since I switched from an expensive Clinique product that was way more $$ & started to not provide what I needed. Yes, I happily recommend it; many friends now use it, & now, even my husband too!

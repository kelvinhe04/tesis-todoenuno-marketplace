                      - paragraph [ref=f415e2291]: This mousepad is worth every penny. It may be slightly expensive at $60, but you really are getting what you paid for. I got the extended version, which is absoloutley massive. It has room for a full size keyboard and a mouse with room to spare. The mat is made of a nice soft material with the chroma lighting around the sides. My main skepticism was that the threads holding the chroma lighting would be weak, but they are strong and hold the lighting tight against the pad. If you read reviews saying that the pad doesn't lay down flat, please ingore them. The instructions in the box clearly states that you need to give the pad some time to settle and adapt to a flat surface (it comes rolled on a cardboard tube so that it doesn't have creaces). Mine started with a few small spots where it wouldn't lay down, but after a day of sitting they were gone. Other reviews state that the pads soft top is easily torn, but mine is very sturdy and won't come up even if you try to remove it. This mousepad is a great product, with the typical Razer quality that is expected. If you see a bad review, chances are that any problems were caused by peoples own error and inability to read the instructions. This mousepad adds flair to your setup that you really wouldn't expect a simple lighted mat to add. When paired with an RGB keyboard and mouse, it makes for a brilliant light show.

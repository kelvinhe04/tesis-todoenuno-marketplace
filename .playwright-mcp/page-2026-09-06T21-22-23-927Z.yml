                      - generic [ref=f415e2337]:
                        - paragraph [ref=f415e2338]: This replaced a fairly inexpensive no-name mouse/keyboard mat and it's been worth the money so far. Although slightly pricey, it's competitive with other name-brand products in its class. It's well made and big enough to comfortably accommodate my Corsair keyboard and Logitech MX Master 3 with no worries about running out of room. The mouse tracks exceptionally well. Stitching around the edges is good and the mat laid flat right out of the box (I've seen other reviews here stating that was a problem, but fortunately I didn't have that issue). The mat doesn't move on its own and stays put even during a hard gaming session, exactly as it should.
                        - paragraph
                        - paragraph [ref=f415e2339]: "The Synapse software is what takes this product to the next level: the mouse mat can change color and react to what's on the screen, or just a portion of it - but my favorite is the VU meter effect where the colors pulse to whatever music or audio is playing. Colors are not overly bright, but I don't find this to be an issue; it's for accent after all. If you have a Razer mouse, you can trigger effects on the mat based on your input. Lastly the mat can also be used for notifications by integrating it with Outlook and other apps (unfortunately Slack isn't one of those anymore)."
                        - paragraph
                        - paragraph [ref=f415e2340]: I'd buy this again, and would definitely recommend to others. It's a quality product and is built to last.

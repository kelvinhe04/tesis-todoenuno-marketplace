                        - generic [ref=f415e2435]:
                          - paragraph [ref=f415e2436]: I've been in need of a good desktop mat for some time now, and finally decided to get something to match my Razer Blackwidow Chroma keyboard and Razer Naga Epic Chroma. It integrated perfectly with Razer Synapse, and got set up alongside my keyboard and mouse with relative ease (some of the chroma effects need a little tweaking to work with the simple border light, but it wasn't too bad). Also, it's pretty huge, but in a good way. It not only fits my keyboard and mouse, but has room for my personal phone and my work phone on the opposite side, which really partitions my desk nicely!
                          - paragraph
                          - paragraph [ref=f415e2437]: Comfort-wise, I'd definitely recommend using it alongside a gel wrist support. The light strip is held on by thin stitching, which looks nice, but it pretty irritating and abrasive on the wrists when they're rested against it bare - almost like itchy rope. The mat itself is really soft and comfortable though, so no complaints there.
                          - paragraph
                          - paragraph [ref=f415e2438]: Dust and dander can be a bit of a pain to brush off because of the soft texture, but I haven't had it long enough to know if this will be any sort of a long running problem. I can't imagine it being a magnet for dirt though since it's a pretty smooth surface for what it is. It did definitely pick some things up within a minute of going down on my clean desk though, so don't expect it to be a spotless black for long at all.
                          - paragraph
                          - paragraph [ref=f415e2439]: All in all, I'm extremely satisfied, but I was already set up pretty nicely to have it ahead of time. Again, I really recommend having a wrist support with this so you don't rub your wrists raw against the stitching, otherwise this is a great desktop accent piece / mousepad!

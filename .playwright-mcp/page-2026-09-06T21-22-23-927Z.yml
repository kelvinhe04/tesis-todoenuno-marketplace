                          - /url: /gp/help/customer/display.html/ref=cm_cr_dp_d_rvw_avp?ie=UTF8&nodeId=G8UYX7LALQC8V9KA
                      - paragraph [ref=f415e2491]: The surface on this mouse pad is extremely smooth, and my mouse glides across it effortlessly whether I’m working or gaming. The RGB strip is bright enough to stand out but not overly harsh, and it gives a clean edge-lighting effect along the entire mat. It also stays firmly in place with no slipping, which is ideal for fast movements. My wife’s desk is 47 inches wide, and this pad fits it perfectly with room for both the keyboard and mouse. No complaints — it’s a great upgrade to any Razer or RGB-themed setup. My only complaint is that the RGB isn't as customizable via SignalRGB as it is in other gaming mousepads.

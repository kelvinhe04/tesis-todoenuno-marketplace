                      - generic [ref=f415e2531]:
                        - generic [ref=f415e2537]:
                          - paragraph [ref=f415e2538]: Before I address the headline, let me say that this is a very fine, very large mouse mat that is excellent in all respects. The surface material is smooth and well suited to gaming, no problems with aiming whatsoever, the lights work as advertised, there seems to have been an issue with programming the lights before, but in my more recent experience, all it takes is downloading the Razer Synapse software, continuing as a guest (no more login needed), setting it to your preferred configuration, and enjoying the light show.
                          - paragraph
                          - paragraph [ref=f415e2539]: On to the headline.
                          - paragraph
                          - paragraph [ref=f415e2540]: The reason that you do NOT want to buy this used is because of the way that the mouse mat is made. The portion of the mat that lights up is similar in material to a glowstick. If it is bended in any sort of unsightly manner, It will be very hard to form it back to a shape that will look appealing on a flat surface. I am in the process of returning my previous purchase.
                          - paragraph
                          - paragraph [ref=f415e2541]: When it is new, it is carefully rolled up into the box, wrapped around a cardboard cylinder, with a thin film wrapped on top of that so that you don't get a mat that is crinkled up at various points.
                          - paragraph
                          - paragraph [ref=f415e2542]: When it is used, it's highly likely to have been handled by a dude getting paid minimum who will pass off all those crinkles as acceptable.
                          - paragraph
                          - paragraph [ref=f415e2543]: Can't blame them, either. I've been there. You may have been, too.
                          - paragraph
                          - paragraph [ref=f415e2544]: But I can't stand such an aesthetically pleasing mat being marred with edges that will not lie flat, instead having raised bumps all around the borders. Do yourself a favour, and just get this thing brand new. It's a beautiful compliment to any desktop setup. Make sure you have the room for it, too!

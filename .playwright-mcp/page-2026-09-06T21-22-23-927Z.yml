                      - generic [ref=f415e2386]:
                        - paragraph [ref=f415e2387]: I own the Goliathus Extended, along with Razer Firefly Hard V2 and the Razer Naga Trinity Gaming mouse. The end result ? It's awesome ! This is a must have if you are a RGB fan and have a home office desk (work / gaming ..). I am using the Razer Synapse software for weeks now, haven't had any issues so far. The RGB light between the 3 is synchronized which is giving providing awesome effect !
                        - paragraph
                        - paragraph [ref=f415e2388]: "The build quality is great: the materials is of high finish. You can use it to place a keyboard, mouse and rest pads, and you will still get room for other stuff. I also like this Goliathus Extended because I can use still write on papers on top."
                        - paragraph
                        - paragraph [ref=f415e2389]: The RGB lighting effects are awesome ! Not as advanced as the Razer Firefly Hard V2, but still it provides an amazing result. The light diffuser is of high quality (you can't see where the RGB Leds are because the light is very well spread). I keep the light effects on day and night.

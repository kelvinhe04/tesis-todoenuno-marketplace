                        - 'link "Size: 11.6L x 36.3W inches Color: Classic Black Pattern Name: Mousepad" [ref=f415e2476] [cursor=pointer]':
                          - /url: /portal/customer-reviews/B07DG64YL9/ref=cm_cr_dp_d_rvw_fmt?_encoding=UTF8&formatType=current_format

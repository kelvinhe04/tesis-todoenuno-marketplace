                      - generic [ref=f415e2590]:
                        - generic [ref=f415e2596]:
                          - paragraph [ref=f415e2597]: Very happy with this product. I have a large desk and I use my keyboard and mouse to game. This mat is large enough to accommodate whatever configuration I need. Most importantly, it provides awesome grip and precision for my optical mouse (I use a Razer Basilisk), and good grip for my keyboard (I use a Razer Cynosa Chroma), which now does not shift at all when I'm mashing keys in live combat. Bonus - it looks hella cool with my LED mouse and keyboard. The LED lit edging is not bumpy or raised above the mat, so there is no skin irritation on my wrists or lower arms while using it.
                          - paragraph
                          - paragraph [ref=f415e2598]: I was a bit unsure of purchasing it at first, because of the cost (and I was hoping to find one with graphics on the mat itself), but like all Razer products, it's high quality, and does its jobs very well. If they ever make one with graphics that are based on popular fantasy MMORPGs or fantasy topics/subjects instead of mostly FPS, I'd own one of those, too! The black is super slick though, and looks really good on my desk.
                          - paragraph
                          - paragraph [ref=f415e2599]: As far as cleaning goes, I have Siberian Huskies and their hair often gets stuck on the mats off my sleeves, and it takes some work to get them off. That's not a bad thing though - it's a testament to its grippy nature. I just use a non-shedding type cotton cloth to lightly wipe it off and keep it clean. I've not tried to clean it beyond a surface dusting, so not sure how it will hold up when it needs a more solid cleaning, but I'd doubt I'll have any problems with it.

                      - generic [ref=f415e2876]:
                        - generic [ref=f415e2882]:
                          - paragraph [ref=f415e2883]: "Pros:"
                          - paragraph [ref=f415e2884]: "-Light diffuser is very even across the whole thing, surprisingly. The exception is the corners, but hey, welcome to physics limitations, take a number and we'll process your complaint sometime in the next 3 millennia."
                          - paragraph [ref=f415e2885]: "-No obnoxious branding on the cloth itself. Very slick, smooth surface."
                          - paragraph [ref=f415e2886]: "-USB cable is long enough that it's not a problem. 21.3 units big. What units you ask? Stop asking questions."
                          - paragraph [ref=f415e2887]: "-Very sturdy, high-quality construction."
                          - paragraph [ref=f415e2888]: "-Nice and wide, just how I like my mousepads. Keeps the keyboard on the same height as the mouse. You wouldn't think it does much for ergonomics but it's got like a high-class feel to it and makes you feel richer than we both know you are."
                          - paragraph
                          - paragraph [ref=f415e2889]: "Cons:"
                          - paragraph [ref=f415e2890]: "-Light bar is stitched on. That itself isn't the problem, but the (surprisingly strong) string used tends to dig into your skin a bit and feels rough after a while. Not as big of a problem as you think it is. I don't notice much, even after a 16-hour gaming marathon. Usually some red skin after that, but that's not surprising."
                          - paragraph [ref=f415e2891]: "-CLOTH. God I hate cloth. Spill one thing on it and the stain ruins the slick appearance forever. Wears down your mouse skates. Frays over time. Sure it looks nice, but god I wish you could get extended PLASTIC mousepads."
                          - paragraph
                          - paragraph [ref=f415e2892]: Complaints are mild and may vary due to personal taste. Honestly a really high-quality mousepad with gorgeous vibrancy. Not very bright, but then again I wouldn't want it to be; would be too distracting.

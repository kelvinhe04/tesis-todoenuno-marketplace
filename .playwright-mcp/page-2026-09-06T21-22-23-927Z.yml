                        - generic [ref=f415e2788]:
                          - paragraph [ref=f415e2789]: Honestamente después de ver los reviews que aquí han dado tenia las expectativas demasiado bajas sobre todo por el tema de que estaba deforme y con ondulaciones horribles.
                          - paragraph
                          - paragraph [ref=f415e2790]: La realidad es que el tapete es una maravilla, me llego bien empaquetado y no muestra ninguna ondulación ya sea por delante o por atrás como se aprecia en la foto (hagan caso a las instrucciones y déjenlo reposar las 24 horas, usenlo pero no traten de "arreglarlo" ustedes no sean impacientes) la luz en condiciones oscuras donde normalmente resalta más los leds es muy buena y llamativa sobre todo si combinas los demás productos razers aunque honestamente el pad por si solo como ya mencione esta pasado de ...ga.
                          - paragraph
                          - paragraph [ref=f415e2791]: En funcionalidad es muy bueno y preciso si lo combinas con un buen ratón, en mi caso por ejemplo tengo el deathadder chroma que ya es una generación pasada y me va muy bien aunque si tuviera que ser franco yo que tengo la posibilidad de tener un firefly también tendría que decir que me quedo con el firefly, en mi humilde opinión la versión hard para mi es un poco mejor que el goliathus soft ya que no me gusta sentir esa pequeña resistencia que causa valga la redundancia la versión soft.
                          - paragraph
                          - paragraph [ref=f415e2792]: El precio me parece un poco alto pero razer siempre ha sido así y creo incluso le da un poco de exclusividad al final de cuentas va de cada quien si les parece caro o no.
                          - paragraph
                          - paragraph [ref=f415e2793]: En resumen si tienes el dinero y quieres un articulo llamativo y sobre todo funcional dale sin miedo.

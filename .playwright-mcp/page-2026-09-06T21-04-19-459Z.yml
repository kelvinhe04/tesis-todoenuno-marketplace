          - generic [ref=f276e1317]:
            - heading "Find women's handbags that inspire self-expression." [level=2] [ref=f276e1318]
            - paragraph [ref=f276e1319]:
              - text: Our collection of women's handbags offers something for everyone. Discover
              - link "crossbody bags," [ref=f276e1320] [cursor=pointer]:
                - /url: https://www.coach.com/shop/women/handbags/crossbody-bags
              - link "tote bags," [ref=f276e1321] [cursor=pointer]:
                - /url: https://www.coach.com/shop/women/handbags/totes-carryalls
              - link "backpacks" [ref=f276e1322] [cursor=pointer]:
                - /url: https://www.coach.com/shop/women/handbags/backpacks
              - text: ", travel bags, shoulder bags & hobos, satchels, clutches and belt bags for every look, activity and occasion. Explore handbags for women in a variety of silhouettes and materials including leather backpacks, crossbody bags in Signature Canvas, carryalls in supple suede or"
              - link "straw bags" [ref=f276e1323] [cursor=pointer]:
                - /url: https://www.coach.com/shop/women/handbags/view-all?fabrication=Straw
              - text: like the Brooklyn. Our beautifully crafted handbags are designed to inspire confident self-expression and crafted to be loved for a long time.
          - generic [ref=f276e1324]:
            - heading "Women's handbags that are just your style." [level=2] [ref=f276e1325]
            - paragraph [ref=f276e1326]: Designed to be carried, loved and worn for years to come, our women's handbags bring confidence and versatility to every moment while developing character with every wear.
            - paragraph [ref=f276e1327]: For the office, our women's tote bags hold everything from your laptop to your essentials without compromise on style. Travel bags are built to handle airport trips and weekend getaways, while backpacks for women offer hands-free comfort. Crossbody bags keep you secure and stylish, while clutches for women add polish to any look. Shoulder bags are the perfect everyday carry that is essential to your handbag collection. Our suede bags for women add warmth and richness and our leather bags are crafted from genuine materials that develop character over time.
            - paragraph [ref=f276e1328]:
              - text: Whatever you choose, find a
              - link "Coach wallet" [ref=f276e1329] [cursor=pointer]:
                - /url: https://www.coach.com/shop/women/wallets-wristlets/view-all
              - text: that matches (and fits inside).
            - heading "Beautifully crafted women's handbags." [level=2] [ref=f276e1330]
            - paragraph [ref=f276e1331]:
              - text: What sets Coach women's handbags above the rest? Beautiful, carefully selected materials, like
              - link "buttery-soft suede," [ref=f276e1332] [cursor=pointer]:
                - /url: https://www.coach.com/shop/women/handbags/view-all?fabrication=Suede
              - text: smooth Sport Calf leather, Signature Jacquard and more. Some, like Glovetanned Leather, get even better with age. (There's a reason we're called the Original American House of Leather.)
            - paragraph [ref=f276e1333]: Our attention to the little things makes our everyday handbags for women extraordinary. Look closely. From thoughtfully sized pockets to beautiful stitching, you can see and feel what sets our bags and handbags apart.
            - paragraph [ref=f276e1334]: "One thing that every Coach handbag has in common: a story patch on the inside. Each one is marked with a unique registration number for its style, symbolizing the authenticity of Coach leather bags (and proving that what's on the inside counts)."
            - heading "FAQs:" [level=2] [ref=f276e1335]
            - heading "What's the best way to store Coach handbags?" [level=2] [ref=f276e1337]
            - paragraph [ref=f276e1338]: To help preserve the shape and finish of your Coach handbag, store it in its dust bag in a cool, dry place away from direct sunlight and humidity. If possible, lightly stuff the interior with tissue paper to help maintain its shape, and avoid hanging the bag by its straps for extended periods. Keeping handbags stored properly can help protect the leather, hardware, and overall structure over time.
            - heading "How to care for a Coach handbag?" [level=2] [ref=f276e1339]
            - paragraph [ref=f276e1340]:
              - text: The best care method for a women's handbag from Coach all depends on the material of your bag. For leather styles, gently wipe the surface with a soft, dry cloth and use a leather cleaner and moisturizer as needed, always spot-testing first. For canvas, jacquard, or fabric styles, remove surface dirt with a soft cloth and avoid harsh cleaning products. Regardless of material, keep your handbag away from excessive moisture, heat, and direct sunlight, and store it properly when not in use. To learn more about caring for your Coach handbag, check out our
              - link "leather" [ref=f276e1341] [cursor=pointer]:
                - /url: https://www.coach.com/stories/guides/leather
              - text: and
              - link "non-leather care guides." [ref=f276e1342] [cursor=pointer]:
                - /url: https://www.coach.com/stories/guides/non-leather-materials
            - heading "What are the most popular handbag styles from Coach?" [level=2] [ref=f276e1343]
            - paragraph [ref=f276e1344]:
              - text: Coach offers a variety of iconic handbag silhouettes to suit different lifestyles and occasions. Popular styles include shoulder bags, totes, crossbody bags and satchels. Beloved collections such as the
              - link "Tabby" [ref=f276e1345] [cursor=pointer]:
                - /url: https://www.coach.com/shop/women/collections/tabby
              - text: and
              - link "Brooklyn" [ref=f276e1346] [cursor=pointer]:
                - /url: https://www.coach.com/shop/brooklyn-bags
              - text: have become customer favorites due to their blend of timeless design, functionality and signature Coach craftsmanship.
            - heading "What size Coach handbag should I get?" [level=2] [ref=f276e1347]
            - paragraph [ref=f276e1348]:
              - text: The right Coach handbag size depends on your lifestyle and how much you carry day to day. Choose a
              - link "small or mini bag" [ref=f276e1349] [cursor=pointer]:
                - /url: https://www.coach.com/shop/women/handbags/view-all?bagSize=Small
              - text: if you only need essentials like your phone, wallet and keys. A medium bag works well for everyday use, fitting extras like your lip balm and cosmetics. For work, travel or busy days, a large tote or carryall provides plenty of room for a laptop, spare sweater and more.
            - heading "What materials are Coach handbags made from?" [level=2] [ref=f276e1350]
            - paragraph [ref=f276e1351]: We use a range of high-quality materials for our women's handbags, including canvas, suede, polished pebble leather and our famous Glovetanned Leather. We're also partial to Signature Jacquard, which weaves in our iconic Signature pattern and straw bags. As the Original American House of Leather, Coach is known for its heritage craftsmanship and commitment to creating beautifully made bags designed to be worn and loved for years to come.

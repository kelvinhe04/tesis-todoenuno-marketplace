      - generic [ref=f188e85]:
        - heading "Right to Repair is a global movement to secure our access to:" [level=2] [ref=f188e86]
        - generic [ref=f188e87]:
          - paragraph [ref=f188e89]: Parts and tools to get our stuff fixed
          - paragraph [ref=f188e91]: Manuals and diagnostics manufacturers use
          - paragraph [ref=f188e93]: Software to reset security locks and pair parts
      - generic [ref=f188e94]:
        - heading "Would you buy a car if you couldn't replace the tires?" [level=2] [ref=f188e95]
        - heading "So why buy a phone if you can't replace the battery?" [level=2] [ref=f188e96]
      - generic [ref=f188e97]:
        - heading "Independent shops keep repair fair. The Right to Repair keeps independent shops open." [level=2] [ref=f188e98]
        - paragraph [ref=f188e99]:
          - text: When manufacturers don't make parts and tools available, they create repair monopolies and hurt small businesses.
          - link "96% of independent repair shops we surveyed" [ref=f188e100] [cursor=pointer]:
            - /url: https://uspirg.org/sites/pirg/files/resources/National%20Repair%20Shop%20Survey_0.pdf
          - text: have to turn customers away because of repair restrictions. If the Right to Repair is not protected in law, their businesses will suffer. Manufacturers at their own service centers can push you to buy new instead of repairing. They can set prices wherever they like. And they can
          - link "shred reusable devices" [ref=f188e101] [cursor=pointer]:
            - /url: https://www.ifixit.com/News/94386/the-truth-about-apples-free-iphone-recycling-program-the-earth-deserves-better
          - text: instead of recycling them. Having to compete with independent shops keeps manufacturers honest.
      - generic [ref=f188e102]:
        - heading "Repair Is Freedom" [level=2] [ref=f188e106]
        - paragraph [ref=f188e107]: "The Right to Repair movement is founded on a fundamental principle: If you bought it, you own it, and you should be able to fix it. Nobody should be able to block you from restoring your things to their original function."
        - generic [ref=f188e108]:
          - link [ref=f188e109] [cursor=pointer]:
            - /url: https://www.ifixit.com/News/61140/what-is-right-to-repair
            - heading "We deserve the right to repair." [level=3] [ref=f188e110]
            - generic [ref=f188e111]: Read Article
          - link [ref=f188e114] [cursor=pointer]:
            - /url: /News/category/right-to-repair
            - heading "Catch up with the latest news." [level=3] [ref=f188e115]
            - generic [ref=f188e116]: Read News
      - generic [ref=f188e119]:
        - heading "Repair creates Jobs" [level=2] [ref=f188e123]
        - paragraph [ref=f188e124]: If it can be fixed, it should be. Refurbished cell phones can be sold to someone new. Repaired computers bridge the digital divide. Even better, repair jobs are local. They won’t ever be shipped overseas.
        - generic [ref=f188e125]:
          - link [ref=f188e126] [cursor=pointer]:
            - /url: /Right-to-Repair/Jobs-Revolution
            - heading "It’s time for a repair jobs revolution." [level=3] [ref=f188e127]
            - generic [ref=f188e128]: Read Article
          - link [ref=f188e131] [cursor=pointer]:
            - /url: /Right-to-Repair/Repairable-Products
            - heading "Repairable products make good sense." [level=3] [ref=f188e132]
            - generic [ref=f188e133]: Read Article
          - link [ref=f188e136] [cursor=pointer]:
            - /url: /Right-to-Repair/Resources
            - heading "Let's build a repairable world." [level=3] [ref=f188e137]
            - generic [ref=f188e138]: Browse Resources
      - generic [ref=f188e141]:
        - heading "Repair is Sustainable" [level=2] [ref=f188e145]
        - paragraph [ref=f188e146]: Our stuff used to be made to last. Now it’s made to last only a couple of years. Repair is green. It keeps the stuff you love in service, and out of a landfill.
        - generic [ref=f188e147]:
          - link [ref=f188e148] [cursor=pointer]:
            - /url: /Right-to-Repair/E-waste
            - heading "What’s the problem with e-waste?" [level=3] [ref=f188e149]
            - generic [ref=f188e150]: Read Article
          - link [ref=f188e153] [cursor=pointer]:
            - /url: /Right-to-Repair/Recycling
            - heading "Recycling is destruction." [level=3] [ref=f188e154]
            - generic [ref=f188e155]: Read Article
          - link [ref=f188e158] [cursor=pointer]:
            - /url: /Right-to-Repair/Manufacturing
            - heading "Manufacturing and mining are toxic." [level=3] [ref=f188e159]
            - generic [ref=f188e160]: Read Article
      - generic [ref=f188e163]:
        - heading "Frequently Asked Questions" [level=2] [ref=f188e167]
        - paragraph [ref=f188e168]: "The question we hear most often: How isn't the Right to Repair already protected in law everywhere? If that's your question, our sympathies. We agree—it's beyond time to fix our broken repair laws. But if you've got other questions, check out the list below."
        - generic [ref=f188e169]:
          - heading "Isn't stuff too complicated for most people to repair it these days?" [level=3] [ref=f188e170]
          - paragraph [ref=f188e171]: Even in complicated objects like smartphones and cars, most repairs are simple—you replace a broken part with an intact one. If you can change a broken light bulb, you've got the skills you need to do the most-common electronics repairs.
          - heading "If I'm never going to fix my own phone, why should I care about the Right to Repair?" [level=3] [ref=f188e172]
          - paragraph [ref=f188e173]: Manufacturers' repair restrictions make repair more expensive and difficult to find for everyone. When all repair has to go through a manufacturer's authorized center, you may wait a long time for repairs. They can charge you whatever they like, without competition. And they might tell you that something can't be fixed even when that's untrue, because they make more money when you replace your stuff instead of repairing it. Breaking up those repair monopolies helps us all.
          - heading "Will I void my warranty if I repair something myself or take it to an independent repair shop?" [level=3] [ref=f188e174]
          - paragraph [ref=f188e175]:
            - text: In the US, it's
            - link "illegal for manufacturers to void your warranty" [ref=f188e176] [cursor=pointer]:
              - /url: https://www.ifixit.com/News/15464/warranty-voiding-stickers-are-illegal-but-these-companies-are-still-using-them
            - text: for repairing your own stuff or having an independent shop repair it. Similarly, in Australia, courts have confirmed that customers may choose their own repair avenue for
            - link "cars" [ref=f188e177] [cursor=pointer]:
              - /url: https://coxauto.com.au/can-i-have-my-car-serviced-at-an-independent-workshop/
            - text: and
            - link "phones" [ref=f188e178] [cursor=pointer]:
              - /url: https://www.accc.gov.au/media-release/iphone-and-ipad-misrepresentations-cost-apple-inc-9-million-in-penalties
            - text: without voiding their consumer protections. Warranty laws vary by country, so check your local regulations.
          - heading "Why are manufacturers so opposed to the Right to Repair movement?" [level=3] [ref=f188e179]
          - paragraph [ref=f188e180]:
            - text: The simple answer is that repair monopolies make manufacturers money. In their own shops, they can set repair prices and push you to buy new. Even though Right to Repair legislation polls incredibly well—
            - link "in one poll, 84% of respondents" [ref=f188e181] [cursor=pointer]:
              - /url: https://advocacy.consumerreports.org/press_release/consumer-reports-survey-finds-americans-overwhelmingly-support-the-right-to-repair/
            - text: were in favor—it's seen fierce opposition from manufacturers' lobbying groups. The companies publicly recorded as lobbying against Right to Repair are
            - link "collectively worth $10.7 trillion" [ref=f188e182] [cursor=pointer]:
              - /url: https://uspirg.org/blogs/blog/usp/who-doesn%E2%80%99t-want-right-repair-companies-worth-over-10-trillion
            - text: . Manufacturers will say they're worried about customer safety or data security, but
            - link "the US Federal Trade Commission says" [ref=f188e183] [cursor=pointer]:
              - /url: https://www.ftc.gov/system/files/documents/reports/nixing-fix-ftc-report-congress-repair-restrictions/nixing_the_fix_report_final_5521_630pm-508_002.pdf
            - text: there is 'scant evidence to support' these arguments.
          - heading "Why do manufacturers say they're worried about customer safety? Is repair dangerous?" [level=3] [ref=f188e184]
          - paragraph [ref=f188e185]:
            - text: Electronics repair is
            - link "six times safer" [ref=f188e186] [cursor=pointer]:
              - /url: https://www.bls.gov/web/osh/summ1_00.htm
            - text: than the average job. Sure, swollen batteries can catch fire, and you should
            - link "be careful when handling them" [ref=f188e187] [cursor=pointer]:
              - /url: https://www.ifixit.com/Wiki/What_to_do_with_a_swollen_battery
            - text: . And
            - link "don't get under your car" [ref=f188e188] [cursor=pointer]:
              - /url: https://www.ifixit.com/Guide/How+to+Jack+Up+a+Car+(or+Truck)/67013
            - text: when it's supported only by a jack. But manufacturers overplay the risks of repair to scare people away—when the main thing repair hurts is manufacturers' bottom line.
          - heading "Lots of proposed Right to Repair laws mention getting into software locks. Will my data be secure, even if repair shops can break those locks?" [level=3] [ref=f188e189]
          - paragraph [ref=f188e190]:
            - text: The software locks that prevent repair aren't the same locks that protect your data.
            - link "Cybersecurity experts agree" [ref=f188e191] [cursor=pointer]:
              - /url: https://www.wired.com/story/right-to-repair-security-experts-california/
            - text: that making repair possible won't endanger device security. The
            - link "US Federal Trade Commission found" [ref=f188e192] [cursor=pointer]:
              - /url: https://www.ftc.gov/system/files/documents/reports/nixing-fix-ftc-report-congress-repair-restrictions/nixing_the_fix_report_final_5521_630pm-508_002.pdf
            - text: "that independent shops are no more or less likely than manufacturers' shops to mishandle customer data. And in fact, manufacturers have already devised systems to make repairs possible while protecting data: In Korea, Samsung Galaxy phones have a Repair Mode that lets customers choose which data to make available while enabling all the repair-necessary features of the phone. All manufacturers across the world could do the same if they wanted."
          - heading "Don't manufacturers have a right to protect their intellectual property?" [level=3] [ref=f188e193]
          - paragraph [ref=f188e194]: Of course they do! And Right to Repair wouldn't challenge that right. The repair manuals that Right to Repair laws are requesting can't be copyrighted. And those laws wouldn't make copyright infringement legal—manufacturers could still pursue anyone making a knockoff product. Plus, repair information shouldn't make copyright infringement any easier. If anything, manufacturers making their own parts available should decrease the incentive for knockoff parts.

      - generic [ref=f188e211]:
        - img "A man and young girl repair a John Deere lawnmower" [ref=f188e212]
        - generic [ref=f188e213]:
          - heading "Corporate lobbyists are fighting hard to keep you out of your stuff." [level=2] [ref=f188e214]
          - paragraph [ref=f188e215]:
            - text: Companies opposed to the Right to Repair movement are spending
            - link "millions of dollars each year" [ref=f188e216] [cursor=pointer]:
              - /url: https://maplightarchive.org/story/in-fight-over-the-right-to-repair-equipment-farmers-are-outspent-28-to-1/
            - text: "to pay lobbyists to fight it. John Deere and other farm equipment manufacturers have outspent farmers 28-to-1. They're paying other lawyers, too:"
            - link "There were 17 lawsuits filed" [ref=f188e217] [cursor=pointer]:
              - /url: https://maplightarchive.org/story/in-fight-over-the-right-to-repair-equipment-farmers-are-outspent-28-to-1/
            - text: against Deere in the first six months of 2022 alone.
      - generic [ref=f188e218]:
        - heading "The Right to Repair goes way beyond electronics." [level=2] [ref=f188e219]
        - paragraph [ref=f188e220]: People are having trouble getting the repair parts and information they need for tractors, appliances, wheelchairs, ventilators, hearing aids, snowmobiles, boats—the list goes on. If it can be fixed, some company has probably tried to create a repair monopoly on it.
      - generic [ref=f188e221]:
        - heading "Repair restrictions are everywhere." [level=2] [ref=f188e222]
        - paragraph [ref=f188e223]:
          - text: Beyond
          - link "restricting access to parts" [ref=f188e224] [cursor=pointer]:
            - /url: /News/how-nikon-is-killing-camera-repair
          - text: ", companies block repair in all kinds of other sneaky ways. Sometimes they glue in batteries with industrial-strength adhesives. Sometimes they use"
          - link "proprietary screwheads" [ref=f188e225] [cursor=pointer]:
            - /url: https://www.ifixit.com/blog/2011/01/20/apples-diabolical-plan-to-screw-your-iphone/
          - text: . Sometimes they use software to
          - link "pair parts" [ref=f188e226] [cursor=pointer]:
            - /url: https://www.ifixit.com/News/61140/what-is-right-to-repair
          - text: to your device's serial number or motherboard, either throwing up errors for replacement parts or blocking new parts entirely.
      - generic [ref=f188e228]:
        - heading "Without the Right to Repair, manufacturers will keep locking us out." [level=2] [ref=f188e229]
        - paragraph [ref=f188e230]:
          - text: "Nikon showed us what to expect from a world without a legally secured Right to Repair: They limited repair to their authorized shops, shut down those shops, and"
          - link "now only offer repair in two facilities" [ref=f188e231] [cursor=pointer]:
            - /url: https://www.ifixit.com/News/34241/nikon-is-killing-its-authorized-repair-program
          - text: . Repairs there are slow and expensive—but the only choice. Other manufacturers will keep copying this strategy.

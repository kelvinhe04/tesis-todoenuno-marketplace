          - generic "All Ages & Skill Levels":
            - heading "All Ages & Skill Levels" [level=3]
          - paragraph [ref=f192e141]: No matter where your music journey is starting, we’ll get you where you’re going. Our lessons are for children, teens and adults, ranging from beginners picking up their first instrument to professional musicians honing their skills.

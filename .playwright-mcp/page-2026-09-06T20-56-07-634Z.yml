      - paragraph [ref=f192e124]: Here, you get the VIP treatment. Students get exclusive access to savings, events, workshops and more to elevate your learning experience.
    - generic [ref=f192e126]:
      - article [ref=f192e127]:
        - group [ref=f192e128]:
          - generic "290+ Stores Nationwide":
            - heading "290+ Stores Nationwide" [level=3]
          - paragraph [ref=f192e131]: Discover a Guitar Center near you, meet our team of expert instructors and tour our state-of-the-art Lessons facilities.
      - article [ref=f192e132]:
        - group [ref=f192e133]:

                    - generic [ref=f440e2362]:
                      - generic [ref=f440e2368]:
                        - paragraph [ref=f440e2369]: Easily the best keyboard I've ever bought, and I've bought some high-tier brands in the past for over a hundred dollars.
                        - paragraph
                        - paragraph [ref=f440e2370]: It comes with a keyswitch tool, extra switches, and does not feel cheap in quality.
                        - paragraph [ref=f440e2371]: It also sounds nice when typing. It's that kind-of "muted clack" sound. Hard to describe such things but that's my best shot at it.
                        - paragraph
                        - paragraph [ref=f440e2372]: The size is standard array and my fingers feel good on it.
                        - paragraph [ref=f440e2373]: I was able to switch out my keycaps for WASD (I prefer circular key caps for those) and the caps do not clash with the other caps what-so-ever.
                        - paragraph
                        - paragraph [ref=f440e2374]: The wireless bluetooth and plugged in modes both work well; I was able to use it wirelessly for about 3 days of near-constant use before having to plug it in.
                        - paragraph
                        - paragraph [ref=f440e2375]: Honestly, I just left it plugged in since then so not sure how well the battery is on a recharge.
                        - paragraph
                        - paragraph [ref=f440e2376]: The lights are appealing, the keys look nice; the color scheme is kinda abstract but I'm not mad about it.
                        - paragraph
                        - paragraph [ref=f440e2377]: Overall, great keyboard, and it's held up for a couple months now with no degradation.
                        - paragraph
                        - paragraph [ref=f440e2378]: Thanks Redragon. Appreciate a good product.

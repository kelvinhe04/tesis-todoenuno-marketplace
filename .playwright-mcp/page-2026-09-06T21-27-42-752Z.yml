                    - generic [ref=f440e2605]:
                      - paragraph [ref=f440e2606]: I wouldn't buy this keyboard for more than thirty dollars, but it goes on sale enough that I believe it's worth buying for the twenty or so dollars the bring the price down to. I've had this keyboard for over a year, and it's worked flawlessly for most of that time. There's not much to say about it, functionally. It's a standard full-sized mechanical keyboard. It's not quiet, but I like how clicky it is, personally.
                      - paragraph
                      - paragraph [ref=f440e2607]: Now, for the reason I don't recommend you buy this for full price. About nine or ten months into owning this item, the keys started to behave finicky. The 'R' key no longer lights up and the 'A' key has a problem with double inputs. I'll give the keyboard this, I use it a lot. I'm a writer and a gamer, so I've really put it through its paces. I'm also not as anal about maintenance as I probably should be. If you regularly dust and clean under the keycaps, it would probably last you a good deal longer.
                      - paragraph
                      - paragraph [ref=f440e2608]: If your like me, someone who puts your keyboard through heavy use, I would go with something more durable. If you only intend to game with it, it should be fine for about a year, which for twenty dollars is a fine deal.

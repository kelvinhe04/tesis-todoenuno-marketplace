                    - paragraph [ref=f440e2324]: I would highly recommend this keyboard and company. It worked great for some time and then within the 2 year warranty period, my num1 key started acting up. I use my num pad just enough for it to be bothersome. I reached out to the company with the issue and supporting documentation and they were kind enough to get me a new one sent out, same model and everything. I love the sound of the keyboard, the ergonomics are fantastic, the size is comfortable, it responds that way you think it would/should and is compatible with every program I use. Great product! And YES, you should buy it!

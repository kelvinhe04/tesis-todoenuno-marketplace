                      - 'link "Color: Black" [ref=f440e2233] [cursor=pointer]':
                        - /url: /portal/customer-reviews/B0CF3VGQFL/ref=cm_cr_dp_d_rvw_fmt?_encoding=UTF8&formatType=current_format
                      - link "Verified Purchase" [ref=f440e2236] [cursor=pointer]:
                        - /url: /gp/help/customer/display.html/ref=cm_cr_dp_d_rvw_avp?ie=UTF8&nodeId=G8UYX7LALQC8V9KA
                    - generic [ref=f440e2239]:
                      - generic [ref=f440e2245]:
                        - paragraph [ref=f440e2246]: "(TLDR): The “LED” one (less expensive) works/sounds just as fine, the only real difference is the “QWERTY” one has brighter and more vibrant backlighting."
                        - paragraph
                        - paragraph [ref=f440e2247]: If you just care about functionality/affordability, get the cheaper one. If you care more about aesthetics, spend a lil more!
                        - paragraph
                        - paragraph [ref=f440e2248]: "- - - - -"
                        - paragraph
                        - paragraph [ref=f440e2249]: I have two fellow gamer friends who desperately needed new keyboards, and since I already bought them keycaps, I decided to look for affordable mechanical keyboards for them. Amazon recommended these, reviews seemed promising, but I had another issue.. what’s the difference?? Why is one $10-15 more?? Nothing really explains the difference here and Google couldn’t help me with wtf LED vs QWERTY was (I thought they both were?? 🤨 Idk still learning about keyboards, bear with me here) A few reviews said one was brighter than the other, but other than that, I was unsure why one cost more.
                        - paragraph
                        - paragraph [ref=f440e2250]: One friend only cared about functionality as they work from home, but the other friend very much cares about aesthetics and has a nice gamer setup. So figured, I’ll just get both!
                        - paragraph
                        - paragraph [ref=f440e2251]: "So here’s a breakdown of all the notable but pretty settle differences:"
                        - paragraph
                        - paragraph [ref=f440e2252]: RBG LED (White Logo)
                        - paragraph [ref=f440e2253]: "On Box: Sindri Red Dragon"
                        - paragraph [ref=f440e2254]: "Price: Cheapest Option (great for what you pay for, best affordable option)"
                        - paragraph [ref=f440e2255]: "Sound: Red Switches, not “silent” imo but not too loud either (I think this one sounded SLIGHTLY clackier, but friends couldn’t tell difference, maybe I just watch a lot of keyboard videos to notice lol)"
                        - paragraph [ref=f440e2256]: "Base: Black “Metallic” appearance (bottom keyboard in light pic) Felt slightly lighter, not all that noticeable though"
                        - paragraph [ref=f440e2257]: "Lighting: Not nearly AS vibrant, but still bright enough (top keyboard in dark pic) When you first plug in, the light is stagnant."
                        - paragraph [ref=f440e2258]: "Functionality: No lag so far, smooth typing, perfect for casual gamers or work use"
                        - paragraph
                        - paragraph [ref=f440e2259]: RGB QWERTY (Red Logo)
                        - paragraph [ref=f440e2260]: "On Box: Rudra Red Dragon"
                        - paragraph [ref=f440e2261]: "Price: Slightly Pricier (still great for what you pay for tbh)"
                        - paragraph [ref=f440e2262]: "Sound: Red Switches, same, not “silent” imo but not too loud either"
                        - paragraph [ref=f440e2263]: "Base: Black Plastic appearance (top keyboard in light pic) Felt slightly heavier."
                        - paragraph [ref=f440e2264]: "Lighting: Much more vibrant (bottom keyboard in dark pic, pic doesn’t do justice, it was significantly brighter) When you first plugin, the light is flowing."
                        - paragraph [ref=f440e2265]: "Functionality: No lag so far, smooth typing, perfect for gamers and work use"
                        - paragraph
                        - paragraph [ref=f440e2266]: "- - - - -"
                        - paragraph
                        - paragraph [ref=f440e2267]: My review is already long af, but I’ll have my friends update me on overall usage overtime. The “aesthetics” friend plays way more games on their PC, so I’ll be able to tell heavy gamer use for the QWERTY one. While the “functional” friend will be using it for work, as they work from home, so I’ll tell more daily use for the LED one. 👍 I’ll ask more about the settings as well as time goes on, for now, they’re just happy with their new keyboards!

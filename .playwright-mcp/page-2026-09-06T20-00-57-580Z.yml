                        - generic [ref=f6e2549]:
                          - paragraph [ref=f6e2550]: I'm shocked by how much I enjoyed these cans. Coming from Sennheiser 490 Pros, this headphone was meant for the gym/cycling. For 65 dollars, the anc was a notable level below the Sony XM series, but, it's still great ANC for its pricepoint. It did a good job of muting out the gym. Voices, podcasts, were easier to enjoy without it, and then the music in that anc bubble really popped. This lacks the clarity and soundstaging of my 300 dollar cans, but it was hard to care when that filthy base kicked in.
                          - paragraph
                          - paragraph [ref=f6e2551]: I've never gotten to 'enjoy' the Beats by Dre experience but this was what I imagined it being, and I was really enjoying it. It was like, shameless, greasy fast food. The V shape EQ was real, and I immediately tuned it to the acoustic preset EQ in Soundcore's excellently versatile app. The default curve was too much, I highly recommend cutting it back and I found acoustic to be the best. It cleaned up the mids a lot while still allowing for that stupid big base to rock it.
                          - paragraph
                          - paragraph [ref=f6e2552]: And then, I got the idea to try it out in VR. Why not? I have a friend I cycle with in vr, and we put up an episode of Reacher to bike to. Just an issue with this kind of thing is latency, not so much the fault of these headphones, although there are dongles that can fix that. The ANC experience with vr was unlike anything I'd experienced. It mercifully cut away my fan and the bike noise, and then I got to experience Reacher punching people through walls with this excellent theater-like experience.
                          - paragraph
                          - paragraph [ref=f6e2553]: So, I love em. What was a throwaway 65 dollar fitness splurge, really grew on me. This makes for an excellent theater experience. The battery life is top of class. Everyone seems to say it's durable to typical wear and tear for years. Its app is best in class. This headphone responds nicely to EQ tuning. It supports multidevice pairing. It has passthrough audio mode. It has typical fast forward/rewind/pause controls as one would expect. It has a 3.5mm jack for those in need of that. It has fast charging and uses a standard usb c. I'm going to spend 10 bucks on pads that'll withstand my athletics better before I shred the cuffs with my sweat. 5 stars, runaway value, this is a winner offering.

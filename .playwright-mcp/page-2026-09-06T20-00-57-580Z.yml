                      - paragraph [ref=f6e2658]: "I've had these headphones for a week. Excellent purchase. These are my first noise canceling headphones, and I'm really pleased. They are adjustable for wear, and comfortable. The estimates of how long they work on 1 charge are reliable: i charged mine 5 days ago, have spent 2-3 hours every day using them and have 90% charge left. The ability to adjust sound nuance in the app/equalizer is great for me, because i have some hearing loss in both ears but reset the defaults for my listening needs and music is balanced: nice highs, good bass, great midtones. No tinniness. I had a question about warranty and emailed the support email, and they replied ON A SUNDAY in 30 min. Too soon to say how durable they will be. I give these a B or Bplus for noise cancellation. I would buy these again or trade up when i'm ready to a higher priced Anker item."

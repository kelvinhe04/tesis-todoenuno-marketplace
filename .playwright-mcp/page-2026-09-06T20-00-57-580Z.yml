                      - paragraph [ref=f6e2434]: These are a good value for the money. The sound quality is nice and they are very comfortable. The noise cancelling is good, not great. On an airplane, they are good enough to drown out the engine noise and ambient sounds (people talking, etc.). The only con is when there are announcements by the flight crew I can still hear those pretty clearly. I had to check that they weren’t in transparency mode when the pilot came on. The announcements were louder than the movie I was watching on my phone. They are easy to setup for the first time, and connect quickly every time. The charging cord length is a little bit short, I’d like it about a foot longer so I can charge while using them. They fold up nicely in the provided bag, and the bag has plenty of space for other small items like adapters and such.

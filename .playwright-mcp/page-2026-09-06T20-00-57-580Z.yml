                      - generic [ref=f6e2472]:
                        - generic [ref=f6e2478]:
                          - paragraph [ref=f6e2479]: I wanted to take a few minutes to talk about these new Soundcore Life Q30 headphones I just bought....
                          - paragraph
                          - paragraph [ref=f6e2480]: My existing over-the-ear noise cancelling headphones are the Bose QuietComfort 25 series. I bought those about eight years ago. They are not wireless. That is actually why I'm upgrading now. I want a bluetooth wireless set. I had spent a lot of time shopping around and decided I wanted to buy the Bose Noise Cancelling 700 series. I just wasn't terribly excited about the $379 price tag.
                          - paragraph
                          - paragraph [ref=f6e2481]: I have two sets of Soundcore wireless earbuds that I have been using for a while. I have been quite happy with those and decided to see what Soundcore had to offer in this genre. I made the mistake of looking on Amazon rather than directly on the Soundcore website, but more on that in a minute...
                          - paragraph
                          - paragraph [ref=f6e2482]: I found this set of Soundcore Life Q30 headphones for $79. That's $300 less than I was planning to spend. I decided to take the leap and see if I could be happy with these. If not, I would go back and buy the Bose and relegate these to use when mowing the lawn or something.
                          - paragraph
                          - paragraph [ref=f6e2483]: When I got these, I charged them up and downloaded the app, which I actually had already because of the earbuds... I started listening and put on some of my favorite music that I use to determine how much I like a set of headphones. I listened around to those tracks for an hour or so while walking around.. while driving... while doing various tasks. When you get down to the nitty-gritty here, these things are as good as my Bose headphones, and I think they are better in quite a few ways. The sound quality and the noise cancelling features are on par in my book. If I'm not gonna be happy with these Soundcore headphones, it's not gonna be because of the sound quality. I'm stoked. The build quality on these is excellent as well. They feel fine and sturdy. The ear cups fit comfortably and they provide an excellent level of noise suppression on their own.
                          - paragraph
                          - paragraph [ref=f6e2484]: The Soundcore app has some cool features. The main feature is the equalization control. You can tweak the sound to your own preferences and you can save multiple profiles to suit whatever you are listening to. These things really came alive when I started playing with the EQ. There is also a widget available for the Android desktop so you can quickly and easily change between the listening modes. There are three different noise cancelling modes to choose from. You can also turn noise cancelling on and off as well as select a transparency mode that amplifies the ambient sounds so you can have a conversation with someone without removing the headphones. You can also switch between transparency modes and noise cancelling by cupping your hand over the right earphone.
                          - paragraph
                          - paragraph [ref=f6e2485]: The right side headphone has volume controls and the pause/play button. The right side also has a jack for the included wire if you want to wire into your sound source with a cable. The left headphone has the power button and the listening mode control as well. On the left headphone there is also a USB-C connector where you can charge the headphones.
                          - paragraph
                          - paragraph [ref=f6e2486]: These will also integrate with your phone but I never use that functionality so I won't even talk about it. It's a feature that I just don't use.
                          - paragraph
                          - paragraph [ref=f6e2487]: These headphones also boast a 40-hour play time on a full charge and a 5-minute charge to get your four hours of listening time when you are in a jam for time.
                          - paragraph
                          - paragraph [ref=f6e2488]: I wish I had looked at the Soundcore website before I bought THIS set of headphones. There is a newer model called the Life Q35 that lists for $129. That model boasts some improved communications with the transmitting device for better sound quality and a few other features that might make it worth the extra $50. Even at $129 we are still far below that $379 price point I was looking at with the Bose.
                          - paragraph
                          - paragraph [ref=f6e2489]: I'm NOT raggin' on Bose here either. I'm sure Bose has come a long way since my purchase and they are possibly a LOT better than these. I dunno. I don't have the current models for a comparison and I won't. I am happy enough with these. I may even buy those Life Q35 headphones so I can have an extra set to keep where I use them.

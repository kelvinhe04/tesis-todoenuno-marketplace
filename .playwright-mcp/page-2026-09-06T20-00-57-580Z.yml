            - list [ref=f6e468]:
              - listitem [ref=f6e469]: "Advanced Noise Cancellation Technology: Maintain your focus with Life Q30’s hybrid active noise cancellation. Dual noise-detecting microphones pick up and filter out up to 95% of low-frequency ambient sound to ensure nothing distracts you from your music."
              - listitem [ref=f6e470]: "Ultimate Noise Cancellation Experience: Customize Life Q30’s noise cancellation with 3 modes—Transport minimizes airplane engine noise, Outdoor reduces traffic and wind, and Indoor dampens the sound of busy offices with people talking in the background. Note: ANC is not compatible with an AUX Cable connection."
              - listitem [ref=f6e471]: "Hi-Res Music: Hear every detail of your favorite songs thanks to Life Q30’s 40mm drivers. The highly-flexible silk diaphragms reproduce thumping bass and crisp treble that extends up to 40kHz for improved clarity."
              - listitem [ref=f6e472]: "50-Hour Playtime: Life Q30 active noise cancelling headphones play up to 50 hours of music in noise cancelling mode. Standard mode extends the playtime to 70 hours, while a short 5-minute charge gives you 4 hours of listening."
              - listitem [ref=f6e473]: "Pressure-Free Comfort: Life Q30 active noise cancelling headphones have ultra-soft protein leather earcups with memory foam padding to fit snugly over your ears. The lightweight build also ensures they’re comfortable for long listening sessions."

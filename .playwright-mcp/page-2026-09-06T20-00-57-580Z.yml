                        - paragraph [ref=f6e2703]: They are good, comfortable. I love them very much despite annoyances. A few things i dont like though. This is very rambley but bear with me
                        - paragraph
                        - paragraph [ref=f6e2704]: The turn off button is right where i usually rest my head on my shoulder while laying down, and the headphones turn off. I dont like the sound cancelization... my old ones had normal sound cancelization and i could hear the music better and people less, this one makes it hard to listen to music for as long as it hurts my head. i wish it had a button for pairing/bluetooth instead if a button combo i always have to look up bc i forgot. but again, thats me. I like them enough to keep them until they break, im just noting this stuff down for my next headphones. They also dont turn of by themselves even when disconected, so i forget to turn them off and having been fully charged before, they are dead by morning. Theres no light to indicate when they are on or not, so ill think i turned them off and they will be on still If any of this would bother you I would research other ones. They are quite expensive, i feel like they could be cheaper. Also theres a button for siri i do not use seri and i press it accidentally and its super annoying. I move alot when im listening to music and they fly off my head if i do too much aswell.
                        - paragraph
                        - paragraph [ref=f6e2705]: I think thats it, thank you for reading and good luck finding headphones that work for you.

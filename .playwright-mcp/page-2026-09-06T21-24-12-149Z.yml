                      - paragraph [ref=f423e2426]: I am so impressed with this charger! I paired this Anker 20W Nano Pro with the Anker New Nylon USB-C to Lightning cable for my iPhone 13 Pro Max, and the charging speed is insane, I literally gain 2% battery in about a minute. It’s way faster than any other charger I’ve used. Beyond how well it works, the design is super sleek, simple, and compact (honestly really cute!). It’s a bit pricier than basic chargers, but it is 100% worth every penny. Big fan of Anker now!

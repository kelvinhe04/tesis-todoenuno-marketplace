                      - generic [ref=f13e1314]:
                        - paragraph [ref=f13e1315]: This is the perfect little lamp. I've placed it on a small console table and it looks great. I ordered the special LED lightbulbs they suggested but they never arrived so I went out and purchased bulbs.
                        - paragraph
                        - paragraph [ref=f13e1316]: "Now about the bulbs...everyone seemed confused about them so here is my suggestion: simply go to the supermarket and pick up every day bulbs. You don't need specialized bulbs. I bought both 25 watt and 40 watt bulbs. Do not purchase anything in higher wattage. I discovered I like the 25 watt for me. It throws a nice soft light."
                        - paragraph
                        - paragraph [ref=f13e1317]: "#2. The length of the cord is approximately 5' and the on/off switch is about 12\" from the base of the lamp."
                        - paragraph

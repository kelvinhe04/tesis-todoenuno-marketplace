                          - paragraph [ref=f13e1362]: This is great for a bedside table. It fits standard lightbulbs that I use around the house, but the shade diffuses the light so they aren't as harsh. It has a switch on the cord for turning the light on/off, which I prefer to the lamp styles that have the switch in the stand. (Or one of those dreaded twist ones.) And it looks great with my cozy decor. I've actually paired this with a WiFi-enabled plug so that I can schedule the light on/off and tell Google to turn it on the rest of the time.

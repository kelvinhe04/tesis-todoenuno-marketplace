                      - paragraph [ref=f13e1562]: This lamp is aesthetically pleasing with a warm and calming cast. I have this one as well as the ZEEFO Simple Table Lamp, which I bought at the same time. I kept both of them, as they are in essence, the same lamp. I use one lamp in the spare bedroom where I meditate and where we have guests stay. (It replaced a larger, unwieldy and breakable painted porcelain lamp.) I use the other lamp in the computer room, where I turn it on whenever I am referring to a document, book, etc., while I'm on the computer. This lamp is suitable for all of these uses--and more. It was just what I was looking for.

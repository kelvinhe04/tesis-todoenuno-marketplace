                      - paragraph [ref=f13e1426]: This is a great lamp. It arrived in about 5 days after being shipped. It appears to be shipped from China instead of the U.S. This lamp takes a maximum of a 40 watt incandescent bulb. I had a 60 W LED bulb laying around, so I tried it out in this lamp. Even though the wattage was below the maximum allowed, the lamp was too bright. Even a 40 Watt LED bulb can seem a bit to bright, as the shade on this lamp is very thin, and some LEDs can be a bit brighter than incandescent bulbs . So, I added a smart dimmer to the lamp in order to attenuate the light depending on the mood I wanted. I can also use the Amazon Echo to turn on the light, turn it off, and dim the light. The lamp looks OK when it's not lit, but it looks great when the light is on.

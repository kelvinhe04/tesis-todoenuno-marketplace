              - listitem [ref=f215e575]: "Pack of 10 Queen Sheet Sets – Includes 10 complete 4-piece Queen Sheet Sets (40 total pieces): 10 flat sheets, 10 fitted sheets with up to 16\" deep pockets, and 20 pillowcases. Soft, cooling, and durable microfiber bedding designed for hotels, motels, vacation rentals, guest rooms, and hospital use."
              - listitem [ref=f215e576]: Hotel-quality soft microfiber comfort – Crafted from double-brushed microfiber fabric for an exceptionally soft and smooth feel. Lightweight and breathable construction helps provide year-round comfort while delivering the clean, crisp look and feel expected from resort bedding and hotel linens.

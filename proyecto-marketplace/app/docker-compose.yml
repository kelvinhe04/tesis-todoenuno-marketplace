name: marketplace

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27019:27017"
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build: ./services/auth
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    ports:
      - "3011:3000"
    depends_on:
      postgres:
        condition: service_healthy

  catalogo:
    build: ./services/catalogo
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017/catalogo
      ORDENES_URL: http://ordenes:3000
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3002:3000"
    depends_on:
      - mongo

  carrito:
    build: ./services/carrito
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      CATALOGO_URL: http://catalogo:3000
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3003:3000"
    depends_on:
      - redis
      - catalogo

  ordenes:
    build: ./services/ordenes
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      CARRITO_URL: http://carrito:3000
      CATALOGO_URL: http://catalogo:3000
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3004:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  pagos:
    build: ./services/pagos
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      ORDENES_URL: http://ordenes:3000
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3005:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notificaciones:
    build: ./services/notificaciones
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3006:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    image: devopsfaith/krakend:2.6
    volumes:
      - ./gateway/krakend.json:/etc/krakend/krakend.json
    command: ["run", "-c", "/etc/krakend/krakend.json"]
    ports:
      - "8080:8080"
    depends_on:
      - auth
      - catalogo
      - carrito
      - ordenes
      - pagos
      - notificaciones

volumes:
  pgdata:
  mongodata:
